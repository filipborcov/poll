<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Choose the BEST</title>
  <style>
:root {
  /* Site.pro brandbook palette (site.pro/Brand) */
  --bg: #F1F1F1;          /* Soft White */
  --bg2: #F7F7F7;
  --card: #FFFFFF;
  --border: #E5E5E5;      /* Whisper Gray */
  --text: #242424;        /* Cosmos */
  --muted: #595959;       /* Dark Gray */
  --primary: #EB1E2A;     /* Red */
  --primary2: #D0101C;
  --primary-dark: #85001D;/* Brick */
  --success: #489335;     /* Leaf */
  --warning: #F26518;     /* Carrot */
  --danger: #85001D;      /* Brick */
  --gold: #F68C14;        /* Sunset */
  --silver: #A6A6A6;      /* Medium Gray */
  --bronze: #F26518;      /* Carrot */
  --radius: 12px;
  --shadow: 0 12px 32px rgba(36,36,36,.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Jost", "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.45;
}

.page {
  max-width: 920px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

/* Flash */
.flash-wrap { margin-bottom: 1rem; display: flex; flex-direction: column; gap: .5rem; }
.flash {
  padding: .85rem 1rem;
  border-radius: 12px;
  font-size: .95rem;
  border: 1px solid transparent;
}
.flash-success { background: rgba(72,147,53,.12); border-color: rgba(72,147,53,.3); color: #3A7A2A; }
.flash-warning { background: rgba(242,101,24,.12); border-color: rgba(242,101,24,.3); color: #B8470C; }
.flash-error { background: rgba(235,30,42,.12); border-color: rgba(235,30,42,.3); color: #85001D; }

/* Hero */
.hero { text-align: center; margin-bottom: 1.75rem; }
.hero.compact { text-align: left; margin-bottom: 1rem; }
.hero h1 { font-size: clamp(1.4rem, 4vw, 1.9rem); margin-bottom: .4rem; letter-spacing: -.02em; }
.subtitle { color: var(--muted); font-size: .95rem; max-width: 540px; margin: 0 auto; }
.hero.compact .subtitle { margin: 0; }
.back {
  display: inline-block;
  color: var(--primary2);
  text-decoration: none;
  font-size: .9rem;
  margin-bottom: .6rem;
}
.back:hover { text-decoration: underline; }

/* Team cards */
.teams { display: flex; flex-direction: column; gap: 1rem; }
.team-card {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.15rem 1.25rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-decoration: none;
  color: inherit;
  box-shadow: var(--shadow);
  transition: border-color .2s, transform .15s;
}
.team-card:not(.done):hover {
  border-color: var(--primary);
  transform: translateY(-2px);
}
.team-card.done { opacity: .75; cursor: default; }
.team-badge {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.1rem; flex-shrink: 0;
}
.team-info { flex: 1; min-width: 0; }
.team-info h2 { font-size: 1.15rem; margin-bottom: .15rem; }
.team-info p { color: var(--muted); font-size: .85rem; }
.pill {
  display: inline-block;
  padding: .4rem .75rem;
  border-radius: 999px;
  background: rgba(235,30,42,.15);
  color: var(--primary2);
  font-size: .85rem;
  font-weight: 600;
  white-space: nowrap;
}
.pill.success { background: rgba(72,147,53,.15); color: #3A7A2A; }

/* Ranking list */
.hint-bar {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: .8rem;
  margin-bottom: .6rem;
  padding: 0 .25rem;
}
.rank-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  margin-bottom: 5.5rem;
}
.rank-item {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .55rem 1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: grab;
  user-select: none;
  transition: box-shadow .15s, border-color .15s, opacity .15s;
  touch-action: none;
}
.rank-item:active { cursor: grabbing; }
.rank-item.dragging {
  opacity: .55;
  border-color: var(--primary);
  box-shadow: 0 8px 24px rgba(235,30,42,.25);
}
.rank-item.drag-over {
  border-color: var(--primary2);
  background: rgba(235,30,42,.08);
}
.handle {
  color: var(--muted);
  font-size: 1.1rem;
  letter-spacing: -.05em;
  cursor: grab;
  flex-shrink: 0;
}
.place {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: rgba(36,36,36,.06);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: .9rem;
  color: var(--primary2);
  flex-shrink: 0;
}
.rank-item:nth-child(1) .place { background: rgba(246,140,20,.2); color: var(--gold); }
.rank-item:nth-child(2) .place { background: rgba(166,166,166,.2); color: var(--silver); }
.rank-item:nth-child(3) .place { background: rgba(242,101,24,.2); color: var(--bronze); }
.name { font-weight: 500; font-size: .98rem; }

/* Buttons */
.actions { margin-top: 1.25rem; }
.sticky-actions {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 1rem;
  background: linear-gradient(transparent, var(--bg) 30%);
  display: flex;
  justify-content: center;
  z-index: 20;
}
.btn {
  border: none;
  border-radius: 12px;
  padding: 1rem 1.5rem;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, opacity .2s;
  width: 100%;
  max-width: 420px;
}
.btn.primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  box-shadow: 0 10px 30px rgba(235,30,42,.35);
}
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:disabled { opacity: .5; cursor: not-allowed; }
.btn.danger {
  background: rgba(235,30,42,.15);
  color: #85001D;
  border: 1px solid rgba(235,30,42,.3);
  max-width: 280px;
}
.btn.danger:hover { background: rgba(235,30,42,.25); }

/* Admin */
.admin-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.25rem;
}
@media (min-width: 780px) {
  .admin-grid { grid-template-columns: 1fr 1fr; }
}
.result-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  box-shadow: var(--shadow);
}
.result-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.result-head h2 { font-size: 1.15rem; }
.empty { color: var(--muted); font-size: .95rem; padding: 1rem 0; }
.results-list { list-style: none; }
.result-row {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  grid-template-rows: auto auto;
  gap: .15rem .65rem;
  padding: .65rem 0;
  border-bottom: 1px solid rgba(36,36,36,.05);
  align-items: center;
}
.result-row:last-child { border-bottom: none; }
.r-place {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: rgba(36,36,36,.06);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .85rem;
  grid-row: 1 / 3;
}
.result-row.top:nth-child(1) .r-place { background: rgba(246,140,20,.25); color: var(--gold); }
.result-row.top:nth-child(2) .r-place { background: rgba(166,166,166,.2); color: #595959; }
.result-row.top:nth-child(3) .r-place { background: rgba(242,101,24,.2); color: var(--bronze); }
.r-name { font-weight: 500; font-size: .95rem; }
.r-pts { text-align: right; font-size: .9rem; color: var(--muted); }
.r-pts strong { color: var(--text); font-size: 1rem; }
.r-bar-wrap {
  grid-column: 2 / 4;
  height: 5px;
  background: rgba(36,36,36,.06);
  border-radius: 99px;
  overflow: hidden;
}
.r-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-dark));
  border-radius: 99px;
  min-width: 2px;
}

.reset-box {
  margin-top: 2rem;
  display: flex;
  justify-content: center;
}

.foot {
  margin-top: 2rem;
  text-align: center;
  color: var(--muted);
  font-size: .85rem;
}
.foot code {
  background: rgba(36,36,36,.06);
  padding: .15rem .4rem;
  border-radius: 6px;
  font-size: .8rem;
}

/* SPA extras */
.hidden { display: none !important; }
.admin-link {
  display: inline-block;
  margin-top: 1rem;
  color: var(--muted);
  font-size: .8rem;
  text-decoration: none;
}
.admin-link:hover { color: var(--primary2); }
.import-box {
  margin-top: 1.5rem;
  padding: 1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.import-box textarea {
  width: 100%;
  min-height: 100px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: .75rem;
  font-family: ui-monospace, monospace;
  font-size: .8rem;
  margin: .5rem 0;
  resize: vertical;
}
.import-box .row {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
}
.btn.secondary {
  background: rgba(235,30,42,.15);
  color: var(--primary2);
  border: 1px solid rgba(235,30,42,.3);
  max-width: none;
  width: auto;
  padding: .65rem 1rem;
  font-size: .9rem;
}
.note-banner {
  background: rgba(242,101,24,.1);
  border: 1px solid rgba(242,101,24,.25);
  color: #B8470C;
  padding: .75rem 1rem;
  border-radius: 12px;
  font-size: .85rem;
  margin-bottom: 1.25rem;
}

/* voter name + reset box */
.voter-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin: 0 0 14px;
}
.voter-box label {
  display: block;
  font-size: 0.9rem;
  margin-bottom: 8px;
  color: var(--muted);
}
.voter-box input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 1rem;
}
.voter-box input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(235,30,42,.25);
}
.muted { color: var(--muted); font-weight: 400; }

.reset-box {
  display: flex;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
  background: rgba(235,30,42,.08);
  border: 1px solid rgba(235,30,42,.35);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 18px;
}
.reset-box .muted { margin-top: 4px; font-size: 0.9rem; }
.btn.big { padding: 14px 22px; font-size: 1.05rem; font-weight: 700; }
.pill.danger {
  background: rgba(235,30,42,.15);
  color: #85001D;
  border: 1px solid rgba(235,30,42,.3);
}

@media (max-width: 640px) {
  .reset-box { flex-direction: column; align-items: stretch; }
}

/* Combined results table */
.poll-desc { color: var(--text); opacity: .85; margin-bottom: .35rem; }
.summary-card { margin-bottom: 1.25rem; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.summary { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.summary th, table.summary td {
  padding: .5rem .55rem;
  text-align: center;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.summary th { color: var(--muted); font-weight: 600; font-size: .8rem; vertical-align: bottom; }
table.summary th small { font-weight: 400; opacity: .8; }
table.summary .l { text-align: left; }
table.summary td.pl { color: var(--muted); }
table.summary td.tot { font-weight: 700; color: var(--text); }
table.summary tr.top1 td.pl { color: var(--gold); font-weight: 700; }
table.summary tr.top2 td.pl { color: #595959; font-weight: 700; }
table.summary tr.top3 td.pl { color: var(--bronze); font-weight: 700; }
table.summary tbody tr:hover { background: rgba(36,36,36,.03); }

/* "Don't know" */
.skip-btn {
  margin-left: auto;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 8px;
  padding: .25rem .6rem;
  font-size: .8rem;
  cursor: pointer;
  flex-shrink: 0;
}
.skip-btn:hover { color: var(--text); border-color: var(--primary2); }
.skipped-wrap { margin: -4.5rem 0 5.5rem; }
.skipped-title { color: var(--muted); font-size: .8rem; margin: 0 .25rem .5rem; }
.skipped-list { margin-bottom: 0; }
.rank-item.is-skipped { opacity: .5; cursor: default; }
.rank-item.is-skipped .place, .rank-item.is-skipped .handle { visibility: hidden; }
table.summary th { white-space: normal; min-width: 4.5rem; }
table.summary th.l { min-width: 0; }
table.summary td.vc { color: var(--muted); }

/* Free-placement board: higher = better, middle band = "no idea" */
.board {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 5.5rem;
  user-select: none;
  -webkit-user-select: none;
}
.zone { position: relative; padding: 8px; }
.zone-top, .zone-bottom { height: max(320px, 42vh); }
.zone-top { background: linear-gradient(to bottom, #DDF4D7, #FFFFFF); }
.zone-bottom { background: linear-gradient(to bottom, #FFFFFF, #FDE2E5); }
.zone-none {
  display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px;
  min-height: 90px; padding-top: 30px;
  background: var(--bg2);
  border-top: 2px dashed var(--border); border-bottom: 2px dashed var(--border);
}
.zone.drop-target { outline: 2px solid var(--primary2); outline-offset: -2px; }
.zone-label {
  position: absolute; left: 10px; top: 8px;
  font-size: .75rem; font-weight: 700; letter-spacing: .04em; color: var(--muted);
  pointer-events: none;
}
.zone-label-bottom { top: auto; bottom: 8px; }
.board-card {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 10px;
  background: var(--card); border: 1px solid var(--border);
  font-size: .85rem; white-space: nowrap;
  cursor: grab; touch-action: none;
}
.zone-top .board-card, .zone-bottom .board-card { position: absolute; }
.board-card.placed { border-color: var(--primary); }
.board-card.dragging { position: fixed; z-index: 1000; cursor: grabbing; box-shadow: var(--shadow); opacity: .95; }
.card-score { font-size: .7rem; font-weight: 700; color: var(--primary2); }
.card-score:empty { display: none; }
.sticky-actions { align-items: center; gap: 10px; }
.sticky-actions .pill { flex: none; }

/* Language switcher */
.lang-switch {
  display: flex; justify-content: flex-end; gap: 4px;
  max-width: 920px; margin: 0 auto; padding: 10px 1rem 0;
}
.lang-switch button {
  background: transparent; color: var(--muted);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 4px 9px; font-size: .78rem; font-weight: 700; cursor: pointer;
}
.lang-switch button:hover { color: var(--text); border-color: var(--primary2); }
.lang-switch button.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* Site.pro light theme touches */
h1, h2 { font-weight: 600; letter-spacing: -.01em; }
.board { background: var(--card); }
.board-card { box-shadow: 0 1px 2px rgba(36,36,36,.06); }
.board-card.placed { border-color: var(--primary); background: #FFF5F5; }
.card-score { color: var(--primary); }
.zone-none { background: var(--bg2); }
.btn.primary { color: #fff; }
.sticky-actions { background: linear-gradient(rgba(241,241,241,0), var(--bg) 35%); }
.team-badge { background: var(--primary); color: #fff; }
.btn.primary { background: var(--primary); box-shadow: 0 6px 16px rgba(235,30,42,.25); }
.btn.primary:hover { background: var(--primary2); filter: none; }
.r-bar { background: var(--primary); }
button, input, select, textarea { font-family: inherit; }

/* Avatars */
.avatar {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 24px; height: 24px; border-radius: 50%;
  color: #fff; font-size: .62rem; font-weight: 700; letter-spacing: .02em;
  object-fit: cover; pointer-events: none;
}
.r-name, .who { display: inline-flex; align-items: center; gap: 8px; }
.board-card { padding-left: 5px; }

  </style>
</head>

(function () {
  // Free-placement board: three zones stacked vertically.
  //   top zone    -> score 100 (top edge) .. 50 (bottom edge)
  //   "no idea"   -> not rated
  //   bottom zone -> score 50 (top edge) .. 0 (bottom edge)
  // Horizontal position means nothing; it only lets people spread cards out.
  // Works with mouse and touch through Pointer Events.

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function scoreFor(zone, fracY) {
    // fracY: card centre within the zone, 0 = top edge, 1 = bottom edge.
    if (zone === "top") return Math.round(100 - 50 * fracY);
    if (zone === "bottom") return Math.round(50 - 50 * fracY);
    return null;
  }

  function initBoard(board, onChange) {
    const zones = {
      top: board.querySelector('[data-zone="top"]'),
      none: board.querySelector('[data-zone="none"]'),
      bottom: board.querySelector('[data-zone="bottom"]'),
    };
    let drag = null;
    let scrollRaf = 0;
    let lastPointer = null;

    function cardScore(card) {
      const zone = card.parentElement && card.parentElement.getAttribute("data-zone");
      if (zone !== "top" && zone !== "bottom") return null;
      const fy = parseFloat(card.dataset.fy || "0.5");
      return scoreFor(zone, fy);
    }

    function paint(card) {
      const s = cardScore(card);
      const badge = card.querySelector(".card-score");
      if (badge) badge.textContent = s == null ? "" : String(s);
      card.classList.toggle("placed", s != null);
    }

    function zoneAt(clientY) {
      for (const key of ["top", "none", "bottom"]) {
        const r = zones[key].getBoundingClientRect();
        if (clientY >= r.top && clientY <= r.bottom) return key;
      }
      const topR = zones.top.getBoundingClientRect();
      return clientY < topR.top ? "top" : "bottom";
    }

    function placeIn(card, zone, clientX, clientY) {
      const z = zones[zone];
      if (zone === "none") {
        card.style.left = card.style.top = "";
        delete card.dataset.fx;
        delete card.dataset.fy;
        z.appendChild(card);
      } else {
        z.appendChild(card);
        const r = z.getBoundingClientRect();
        const w = card.offsetWidth, h = card.offsetHeight;
        // Keep the whole card inside the zone; store the centre as fractions.
        const cx = clamp(clientX - r.left, w / 2, r.width - w / 2);
        const cy = clamp(clientY - r.top, h / 2, r.height - h / 2);
        const fx = r.width > w ? (cx - w / 2) / (r.width - w) : 0;
        const fy = r.height > h ? (cy - h / 2) / (r.height - h) : 0.5;
        card.dataset.fx = fx.toFixed(4);
        card.dataset.fy = fy.toFixed(4);
        card.style.left = `calc(${(fx * 100).toFixed(2)}% - ${(fx * w).toFixed(1)}px)`;
        card.style.top = `calc(${(fy * 100).toFixed(2)}% - ${(fy * h).toFixed(1)}px)`;

      scrollRaf = 0;
      if (!drag || !lastPointer) return;
      const edge = 70, y = lastPointer.y, vh = window.innerHeight;
      let dy = 0;
      if (y < edge) dy = -Math.ceil((edge - y) / 5);
      else if (y > vh - edge) dy = Math.ceil((y - (vh - edge)) / 5);
      if (dy) {
        window.scrollBy(0, dy);
        scrollRaf = requestAnimationFrame(autoScroll);
      }
    }

      if (!card || !board.contains(card) || (e.button != null && e.button !== 0)) return;
      e.preventDefault();
      const r = card.getBoundingClientRect();
      drag = { card, dx: e.clientX - (r.left + r.width / 2), dy: e.clientY - (r.top + r.height / 2), id: e.pointerId };
      card.setPointerCapture && card.setPointerCapture(e.pointerId);
      card.classList.add("dragging");
      card.style.width = r.width + "px";
      card.style.position = "fixed";
      card.style.left = r.left + "px";
      card.style.top = r.top + "px";
      lastPointer = { x: e.clientX, y: e.clientY };
    }

    function onMove(e) {
      if (!drag || e.pointerId !== drag.id) return;
      e.preventDefault();
      const c = drag.card;
      c.style.left = e.clientX - drag.dx - c.offsetWidth / 2 + "px";
      c.style.top = e.clientY - drag.dy - c.offsetHeight / 2 + "px";
      lastPointer = { x: e.clientX, y: e.clientY };
      const z = zoneAt(e.clientY - drag.dy);
      for (const k in zones) zones[k].classList.toggle("drop-target", k === z);
      if (!scrollRaf) scrollRaf = requestAnimationFrame(autoScroll);
    }

    function onUp(e) {
      if (!drag || e.pointerId !== drag.id) return;
      const c = drag.card;
      const cx = e.clientX - drag.dx, cy = e.clientY - drag.dy;
      c.classList.remove("dragging");
      c.style.position = c.style.width = "";
      for (const k in zones) zones[k].classList.remove("drop-target");

      if (onChange) onChange();
    }

    board.addEventListener("pointermove", onMove);
    board.addEventListener("pointerup", onUp);
    board.addEventListener("pointercancel", onUp);

      // [{name, score}] for every card placed outside "no idea".
      scores() {
        return Array.from(board.querySelectorAll(".board-card"))
          .map((c) => ({ name: decodeURIComponent(c.getAttribute("data-name") || ""), score: cardScore(c) }))
          .filter((x) => x.score != null);
      },
      // Board state, to keep placements when the page is re-rendered (e.g. language switch).
      snapshot() {
        return Array.from(board.querySelectorAll(".board-card"))
          .filter((c) => c.dataset.fy != null)
          .map((c) => ({ name: c.getAttribute("data-name"), zone: c.parentElement.getAttribute("data-zone"), fx: +c.dataset.fx, fy: +c.dataset.fy }));
      },
      restore(list) {
        for (const it of list || []) {
          const card = Array.from(board.querySelectorAll(".board-card")).find((c) => c.getAttribute("data-name") === it.name);
          const z = zones[it.zone];
          if (!card || !z || it.zone === "none") continue;
          z.appendChild(card);
          const w = card.offsetWidth, h = card.offsetHeight;
          card.dataset.fx = String(it.fx);
          card.dataset.fy = String(it.fy);
          card.style.left = `calc(${(it.fx * 100).toFixed(2)}% - ${(it.fx * w).toFixed(1)}px)`;
          card.style.top = `calc(${(it.fy * 100).toFixed(2)}% - ${(it.fy * h).toFixed(1)}px)`;
          paint(card);
        }
        if (onChange) onChange();
      },
      placeIn,
      zones,
    };
  }

        showFlash(t("resetFailed") + ": " + e.message, "error");
      }
    }

    document.getElementById("btn-reset-main").onclick = doReset;
  }

  renderLangSwitch();
  window.addEventListener("hashchange", () => {
    route();
  });
  route();
})();

  </script>
</body>
</html>
