<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Choose the BEST</title>
  <style>
:root {
  --bg: #0b1020;
  --bg2: #12182b;
  --card: #1a2238;
  --border: #2a3555;
  --text: #eef2ff;
  --muted: #94a3b8;
  --primary: #6366f1;
  --primary2: #818cf8;
  --success: #22c55e;
  --warning: #eab308;
  --danger: #ef4444;
  --gold: #fbbf24;
  --silver: #94a3b8;
  --bronze: #d97706;
  --radius: 16px;
  --shadow: 0 20px 50px rgba(0,0,0,.45);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.45;
  background-image:
    radial-gradient(at 10% 0%, rgba(99,102,241,.18) 0, transparent 45%),
    radial-gradient(at 90% 100%, rgba(139,92,246,.12) 0, transparent 45%);
}

.page {
  max-width: 920px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

/* Flash */
.flash-wrap { margin-bottom: 1rem; display: flex; flex-direction: column; gap: .5rem; }
.flash {
  padding: .85rem 1rem;
  border-radius: 12px;
  font-size: .95rem;
  border: 1px solid transparent;
}
.flash-success { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.3); color: #4ade80; }
.flash-warning { background: rgba(234,179,8,.12); border-color: rgba(234,179,8,.3); color: #facc15; }
.flash-error { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.3); color: #f87171; }

/* Hero */
.hero { text-align: center; margin-bottom: 1.75rem; }
.hero.compact { text-align: left; margin-bottom: 1rem; }
.hero h1 { font-size: clamp(1.4rem, 4vw, 1.9rem); margin-bottom: .4rem; letter-spacing: -.02em; }
.subtitle { color: var(--muted); font-size: .95rem; max-width: 540px; margin: 0 auto; }
.hero.compact .subtitle { margin: 0; }
.back {
  display: inline-block;
  color: var(--primary2);
  text-decoration: none;
  font-size: .9rem;
  margin-bottom: .6rem;
}
.back:hover { text-decoration: underline; }

/* Team cards */
.teams { display: flex; flex-direction: column; gap: 1rem; }
.team-card {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.15rem 1.25rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-decoration: none;
  color: inherit;
  box-shadow: var(--shadow);
  transition: border-color .2s, transform .15s;
}
.team-card:not(.done):hover {
  border-color: var(--primary);
  transform: translateY(-2px);
}
.team-card.done { opacity: .75; cursor: default; }
.team-badge {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), #a78bfa);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.1rem; flex-shrink: 0;
}
.team-info { flex: 1; min-width: 0; }
.team-info h2 { font-size: 1.15rem; margin-bottom: .15rem; }
.team-info p { color: var(--muted); font-size: .85rem; }
.pill {
  display: inline-block;
  padding: .4rem .75rem;
  border-radius: 999px;
  background: rgba(99,102,241,.15);
  color: var(--primary2);
  font-size: .85rem;
  font-weight: 600;
  white-space: nowrap;
}
.pill.success { background: rgba(34,197,94,.15); color: #4ade80; }

/* Ranking list */
.hint-bar {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: .8rem;
  margin-bottom: .6rem;
  padding: 0 .25rem;
}
.rank-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  margin-bottom: 5.5rem;
}
.rank-item {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .55rem 1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: grab;
  user-select: none;
  transition: box-shadow .15s, border-color .15s, opacity .15s;
  touch-action: none;
}
.rank-item:active { cursor: grabbing; }
.rank-item.dragging {
  opacity: .55;
  border-color: var(--primary);
  box-shadow: 0 8px 24px rgba(99,102,241,.25);
}
.rank-item.drag-over {
  border-color: var(--primary2);
  background: rgba(99,102,241,.08);
}
.handle {
  color: var(--muted);
  font-size: 1.1rem;
  letter-spacing: -.05em;
  cursor: grab;
  flex-shrink: 0;
}
.place {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: rgba(255,255,255,.06);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: .9rem;
  color: var(--primary2);
  flex-shrink: 0;
}
.rank-item:nth-child(1) .place { background: rgba(251,191,36,.2); color: var(--gold); }
.rank-item:nth-child(2) .place { background: rgba(148,163,184,.2); color: var(--silver); }
.rank-item:nth-child(3) .place { background: rgba(217,119,6,.2); color: var(--bronze); }
.name { font-weight: 500; font-size: .98rem; }

/* Buttons */
.actions { margin-top: 1.25rem; }
.sticky-actions {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 1rem;
  background: linear-gradient(transparent, var(--bg) 30%);
  display: flex;
  justify-content: center;
  z-index: 20;
}
.btn {
  border: none;
  border-radius: 12px;
  padding: 1rem 1.5rem;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, opacity .2s;
  width: 100%;
  max-width: 420px;
}
.btn.primary {
  background: linear-gradient(135deg, var(--primary), #7c3aed);
  color: white;
  box-shadow: 0 10px 30px rgba(99,102,241,.35);
}
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:disabled { opacity: .5; cursor: not-allowed; }
.btn.danger {
  background: rgba(239,68,68,.15);
  color: #f87171;
  border: 1px solid rgba(239,68,68,.3);
  max-width: 280px;
}
.btn.danger:hover { background: rgba(239,68,68,.25); }

/* Admin */
.admin-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.25rem;
}
@media (min-width: 780px) {
  .admin-grid { grid-template-columns: 1fr 1fr; }
}
.result-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  box-shadow: var(--shadow);
}
.result-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.result-head h2 { font-size: 1.15rem; }
.empty { color: var(--muted); font-size: .95rem; padding: 1rem 0; }
.results-list { list-style: none; }
.result-row {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  grid-template-rows: auto auto;
  gap: .15rem .65rem;
  padding: .65rem 0;
  border-bottom: 1px solid rgba(255,255,255,.05);
  align-items: center;
}
.result-row:last-child { border-bottom: none; }
.r-place {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: rgba(255,255,255,.06);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .85rem;
  grid-row: 1 / 3;
}
.result-row.top:nth-child(1) .r-place { background: rgba(251,191,36,.25); color: var(--gold); }
.result-row.top:nth-child(2) .r-place { background: rgba(148,163,184,.2); color: #cbd5e1; }
.result-row.top:nth-child(3) .r-place { background: rgba(217,119,6,.2); color: var(--bronze); }
.r-name { font-weight: 500; font-size: .95rem; }
.r-pts { text-align: right; font-size: .9rem; color: var(--muted); }
.r-pts strong { color: var(--text); font-size: 1rem; }
.r-bar-wrap {
  grid-column: 2 / 4;
  height: 5px;
  background: rgba(255,255,255,.06);
  border-radius: 99px;
  overflow: hidden;
}
.r-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #a78bfa);
  border-radius: 99px;
  min-width: 2px;
}

.reset-box {
  margin-top: 2rem;
  display: flex;
  justify-content: center;
}

.foot {
  margin-top: 2rem;
  text-align: center;
  color: var(--muted);
  font-size: .85rem;
}
.foot code {
  background: rgba(255,255,255,.06);
  padding: .15rem .4rem;
  border-radius: 6px;
  font-size: .8rem;
}

/* SPA extras */
.hidden { display: none !important; }
.admin-link {
  display: inline-block;
  margin-top: 1rem;
  color: var(--muted);
  font-size: .8rem;
  text-decoration: none;
}
.admin-link:hover { color: var(--primary2); }
.import-box {
  margin-top: 1.5rem;
  padding: 1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.import-box textarea {
  width: 100%;
  min-height: 100px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: .75rem;
  font-family: ui-monospace, monospace;
  font-size: .8rem;
  margin: .5rem 0;
  resize: vertical;
}
.import-box .row {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
}
.btn.secondary {
  background: rgba(99,102,241,.15);
  color: var(--primary2);
  border: 1px solid rgba(99,102,241,.3);
  max-width: none;
  width: auto;
  padding: .65rem 1rem;
  font-size: .9rem;
}
.note-banner {
  background: rgba(234,179,8,.1);
  border: 1px solid rgba(234,179,8,.25);
  color: #facc15;
  padding: .75rem 1rem;
  border-radius: 12px;
  font-size: .85rem;
  margin-bottom: 1.25rem;
}

/* voter name + reset box */
.voter-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin: 0 0 14px;
}
.voter-box label {
  display: block;
  font-size: 0.9rem;
  margin-bottom: 8px;
  color: var(--muted);
}
.voter-box input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 1rem;
}
.voter-box input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99,102,241,.25);
}
.muted { color: var(--muted); font-weight: 400; }

.reset-box {
  display: flex;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
  background: rgba(239,68,68,.08);
  border: 1px solid rgba(239,68,68,.35);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 18px;
}
.reset-box .muted { margin-top: 4px; font-size: 0.9rem; }
.btn.big { padding: 14px 22px; font-size: 1.05rem; font-weight: 700; }
.pill.danger {
  background: rgba(239,68,68,.15);
  color: #f87171;
  border: 1px solid rgba(239,68,68,.3);
}

@media (max-width: 640px) {
  .reset-box { flex-direction: column; align-items: stretch; }
}

/* Combined results table */
.poll-desc { color: var(--text); opacity: .85; margin-bottom: .35rem; }
.summary-card { margin-bottom: 1.25rem; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.summary { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.summary th, table.summary td {
  padding: .5rem .55rem;
  text-align: center;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.summary th { color: var(--muted); font-weight: 600; font-size: .8rem; vertical-align: bottom; }
table.summary th small { font-weight: 400; opacity: .8; }
table.summary .l { text-align: left; }
table.summary td.pl { color: var(--muted); }
table.summary td.tot { font-weight: 700; color: var(--text); }
table.summary tr.top1 td.pl { color: var(--gold); font-weight: 700; }
table.summary tr.top2 td.pl { color: #cbd5e1; font-weight: 700; }
table.summary tr.top3 td.pl { color: var(--bronze); font-weight: 700; }
table.summary tbody tr:hover { background: rgba(255,255,255,.03); }

/* "Don't know" */
.skip-btn {
  margin-left: auto;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 8px;
  padding: .25rem .6rem;
  font-size: .8rem;
  cursor: pointer;
  flex-shrink: 0;
}
.skip-btn:hover { color: var(--text); border-color: var(--primary2); }
.skipped-wrap { margin: -4.5rem 0 5.5rem; }
.skipped-title { color: var(--muted); font-size: .8rem; margin: 0 .25rem .5rem; }
.skipped-list { margin-bottom: 0; }
.rank-item.is-skipped { opacity: .5; cursor: default; }
.rank-item.is-skipped .place, .rank-item.is-skipped .handle { visibility: hidden; }
table.summary th { white-space: normal; min-width: 4.5rem; }
table.summary th.l { min-width: 0; }
table.summary td.vc { color: var(--muted); }

/* Free-placement board: higher = better, middle band = "no idea" */
.board {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 5.5rem;
  user-select: none;
  -webkit-user-select: none;
}
.zone { position: relative; padding: 8px; }
.zone-top, .zone-bottom { height: max(320px, 42vh); }
.zone-top { background: linear-gradient(to bottom, rgba(34,197,94,.16), rgba(34,197,94,.02)); }
.zone-bottom { background: linear-gradient(to bottom, rgba(239,68,68,.02), rgba(239,68,68,.16)); }
.zone-none {
  display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px;
  min-height: 90px; padding-top: 30px;
  background: var(--bg2);
  border-top: 2px dashed var(--border); border-bottom: 2px dashed var(--border);
}
.zone.drop-target { outline: 2px solid var(--primary2); outline-offset: -2px; }
.zone-label {
  position: absolute; left: 10px; top: 8px;
  font-size: .75rem; font-weight: 700; letter-spacing: .04em; color: var(--muted);
  pointer-events: none;
}
.zone-label-bottom { top: auto; bottom: 8px; }
.board-card {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 10px;
  background: var(--card); border: 1px solid var(--border);
  font-size: .85rem; white-space: nowrap;
  cursor: grab; touch-action: none;
}
.zone-top .board-card, .zone-bottom .board-card { position: absolute; }
.board-card.placed { border-color: var(--primary); }
.board-card.dragging { position: fixed; z-index: 1000; cursor: grabbing; box-shadow: var(--shadow); opacity: .95; }
.card-score { font-size: .7rem; font-weight: 700; color: var(--primary2); }
.card-score:empty { display: none; }
.sticky-actions { align-items: center; gap: 10px; }
.sticky-actions .pill { flex: none; }

  </style>
</head>
<body>
  <div class="page"><div id="app"><p style="color:#94a3b8;text-align:center;padding:3rem">Loading…</p></div></div>
  <script>
(function () {
  // One team, six polls. Every poll ranks the same people.
  const PEOPLE = [
    "Igor S.","Ilya S.","Inga L.","Irma R.","Jurgita B.",
    "Karolis G.","Laura M.","Marius T.","Mike B.","Mikhail E.",
    "Nadil K.","Rajith K.","Roman M.","Sasha","Aistė B.",
    "Aleksandr S.","Anatoly N.","Anna E.","Dmitry S.","Filip B.",
    "German N.","Snezhana V.","Viktorija Š."
  ];

  const POLLS = [
    ["speed", "Speed at work", "Periodic updates, reaction to posts, fast answers to your questions, etc."],
    ["comm", "Communication", "Nice, friendly, help as much as you ask, always ready for help."],
    ["nobug", "No-bug guarantee", "Closing tasks and mostly none of them have obvious bugs."],
    ["amount", "Amount of work", "Person produces a huge amount of work (huge big tasks, or a lot of small tasks)."],
    ["punct", "Punctuality", "Person is always online during working hours and helps later on rare urgent requests."],
    ["ai", "AI skills", "Person uses AI and agents in daily work."],
  ];

  const TEAMS = {};
  for (const [id, name, desc] of POLLS) {
    TEAMS[id] = { name, desc, short: name, members: PEOPLE };
  }

  window.POLL_CONFIG = {
    ADMIN_SECRET: "rank2026admin",
    TITLE: "Choose the BEST",
    SUBTITLE: "",
    PEOPLE,
    TEAMS,
  };
})();
(function () {
  const DEVICE_KEY = "team-rank-poll-device";
  const LOCAL_KEY = "team-rank-poll-local-votes";

  function getDeviceId() {
    let id = localStorage.getItem(DEVICE_KEY);
    if (!id) {
      id = "d_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      try { localStorage.setItem(DEVICE_KEY, id); } catch (_) {}
    }
    return id;
  }

  function localGet() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch (_) { return []; }
  }
  function localAdd(vote) {
    try {
      const arr = localGet();
      arr.push(vote);
      localStorage.setItem(LOCAL_KEY, JSON.stringify(arr));
    } catch (_) {}
  }
  function localClear() {
    try { localStorage.removeItem(LOCAL_KEY); } catch (_) {}
  }

  // Ballot encoding in the shared store (field "r"):
  //   board ballots: "v2:" + "memberIndex=score" pairs, e.g. "v2:3=87,14=12" (score 0..100)
  //   old list ballots: "memberIndex,memberIndex,..." best first (score = place percentile)
  function compact(teamId, scored) {
    const members = ((window.POLL_CONFIG.TEAMS || {})[teamId] || {}).members || [];
    const parts = scored
      .map((x) => [members.indexOf(x.name), Math.round(Math.max(0, Math.min(100, x.score)))])
      .filter(([i]) => i >= 0)
      .map(([i, sc]) => i + "=" + sc);
    return parts.length ? "v2:" + parts.join(",") : "";
  }

  function expand(row) {
    const teamId = row.t || row.team_id;
    const members = ((window.POLL_CONFIG.TEAMS || {})[teamId] || {}).members || [];
    let ranking = row.ranking;
    let scores = null;
    if (typeof row.r === "string" && row.r.startsWith("v2:")) {
      scores = {};
      for (const pair of row.r.slice(3).split(",")) {
        const [i, sc] = pair.split("=");
        const name = members[parseInt(i, 10)];
        const v = Number(sc);
        if (name && Number.isFinite(v)) scores[name] = Math.max(0, Math.min(100, v));
      }
      ranking = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
    } else if (typeof row.r === "string" && row.r.length) {
      if (row._fmt === "names" || row.r.indexOf("||") !== -1) {
        ranking = row.r.split("||").filter(Boolean);
      } else {
        ranking = row.r.split(",").map((x) => members[parseInt(x, 10)]).filter(Boolean);
      }
    }
    return {
      _id: row._id,
      team_id: teamId,
      ranking: ranking || [],
      scores,
      device: row.d || row.device || "",
      name: row.n || row.name || "",
      ts: row.ts || 0,
    };
  }

  async function api(path, opts) {
    const res = await fetch(path, opts);
    let data = null;
    try { data = await res.json(); } catch (_) {}
    return { res, data };
  }

  async function loadVotes() {
    try {
      const url = "/api/votes?device=" + encodeURIComponent(getDeviceId()) + "&_=" + Date.now();
      const { res, data } = await api(url, { cache: "no-store" });
      if (res.ok && data && Array.isArray(data.votes)) {
        return data.votes.map(expand);
      }
      throw new Error((data && data.error) || "api " + (res && res.status));
    } catch (e) {
      console.warn("api load failed", e);
      return localGet();
    }
  }

  async function load() {
    const votes = await loadVotes();
    const devices = {};
    for (const v of votes) {
      if (v.device && v.team_id) devices[v.device + ":" + v.team_id] = { ts: v.ts, name: v.name };
    }
    return { votes, devices, meta: {} };
  }

  async function hasVoted(teamId) {
    const device = getDeviceId();
    const votes = await loadVotes();
    return votes.some((v) => v.device === device && v.team_id === teamId);
  }

  // scored: [{name, score}] from the board.
  async function addVote(teamId, scored, voterName) {
    const device = getDeviceId();
    const votes = await loadVotes();
    if (votes.some((v) => v.device === device && v.team_id === teamId)) {
      const e = new Error("You have already voted in this poll from this device");
      e.code = "ALREADY";
      throw e;
    }
    const r = compact(teamId, scored);
    if (!r) throw new Error("Empty ballot: place at least one person on the board");

    const { res, data } = await api("/api/vote", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        team_id: teamId,
        r: r,
        device: device,
        name: voterName || "",
      }),
    });

    if (res.status === 409) {
      const e = new Error((data && data.message) || "Already voted");
      e.code = "ALREADY";
      throw e;
    }
    if (!res.ok) {
      throw new Error((data && data.error) || "Could not save (" + res.status + ")");
    }

    localAdd({
      team_id: teamId,
      r: r,
      ranking: scored.map((x) => x.name),
      device: device,
      name: voterName || "",
      ts: Date.now(),
    });
    return data;
  }

  async function votedIds() {
    const device = getDeviceId();
    const ids = {};
    for (const v of await loadVotes()) {
      if (v.device === device) ids[v.team_id] = true;
    }
    return ids;
  }

  // Score of one ballot for a person, 0..100:
  //   board ballots carry the score directly (height on the board: top = 100, bottom = 0);
  //   old list ballots use the place as a percentile: 1st = 100, last = 0, a one-person ballot = 100.
  // People a voter left in "no idea" aren't on that ballot, so a person's poll score
  // averages only the ballots that rated them.
  async function pollScores(teamId, allVotes) {
    const team = (window.POLL_CONFIG.TEAMS || {})[teamId];
    if (!team) return { ranked: [], vote_count: 0, name: "", member_count: 0 };
    const members = team.members;
    const sum = Object.fromEntries(members.map((m) => [m, 0]));
    const cnt = Object.fromEntries(members.map((m) => [m, 0]));
    let voteCount = 0;
    for (const vote of allVotes || (await loadVotes())) {
      if (vote.team_id !== teamId) continue;
      if (vote.scores) {
        const names = Object.keys(vote.scores).filter((name) => name in sum);
        if (!names.length) continue;
        voteCount++;
        names.forEach((name) => {
          sum[name] += vote.scores[name];
          cnt[name] += 1;
        });
        continue;
      }
      const ranking = (vote.ranking || []).filter((name) => name in sum);
      if (!ranking.length) continue;
      voteCount++;
      const k = ranking.length;
      ranking.forEach((name, pos) => {
        sum[name] += k === 1 ? 100 : (100 * (k - 1 - pos)) / (k - 1);
        cnt[name] += 1;
      });
    }
    const ranked = members
      .map((name) => ({ name, votes: cnt[name], score: cnt[name] ? sum[name] / cnt[name] : null }))
      .sort((a, b) => (b.score ?? -1) - (a.score ?? -1) || b.votes - a.votes || a.name.localeCompare(b.name));
    ranked.forEach((item, i) => (item.place = i + 1));
    return { ranked, vote_count: voteCount, name: team.name, member_count: members.length };
  }

  async function isAdmin() {
    try {
      const { res, data } = await api("/api/admin?_=" + Date.now(), { cache: "no-store" });
      return !!(res.ok && data && data.ok);
    } catch (_) {
      return false;
    }
  }

  async function resetAll() {
    const key = window.POLL_CONFIG.ADMIN_SECRET;
    const { res, data } = await api("/api/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Key": key },
      body: JSON.stringify({ key }),
    });
    if (!res.ok) throw new Error((data && data.error) || "Reset failed");
    localClear();
  }

  async function totalBallots(allVotes) {
    const teams = window.POLL_CONFIG.TEAMS || {};
    return (allVotes || (await loadVotes())).filter((v) => v.team_id in teams).length;
  }

  function exportJSON() {
    return JSON.stringify({ votes: localGet() }, null, 2);
  }
  async function importJSON() { return 0; }

  async function ping() {
    try {
      const { res, data } = await api("/api/votes?_=" + Date.now(), { cache: "no-store" });
      if (!res.ok) return { ok: false, mode: "down", error: (data && data.error) || String(res.status) };
      return { ok: true, mode: "api", count: (data && data.count) || (data.votes || []).length };
    } catch (e) {
      return { ok: false, mode: "down", error: String(e.message || e) };
    }
  }

  window.PollStore = {
    load, loadVotes, hasVoted, votedIds, isAdmin, addVote, pollScores, resetAll,
    exportJSON, importJSON, totalBallots, getDeviceId, ping,
    getMode: () => "api",
    cacheGet: () => ({ votes: localGet() }),
  };
})();
(function () {
  // Free-placement board: three zones stacked vertically.
  //   top zone    -> score 100 (top edge) .. 50 (bottom edge)
  //   "no idea"   -> not rated
  //   bottom zone -> score 50 (top edge) .. 0 (bottom edge)
  // Horizontal position means nothing; it only lets people spread cards out.
  // Works with mouse and touch through Pointer Events.

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function scoreFor(zone, fracY) {
    // fracY: card centre within the zone, 0 = top edge, 1 = bottom edge.
    if (zone === "top") return Math.round(100 - 50 * fracY);
    if (zone === "bottom") return Math.round(50 - 50 * fracY);
    return null;
  }

  function initBoard(board, onChange) {
    const zones = {
      top: board.querySelector('[data-zone="top"]'),
      none: board.querySelector('[data-zone="none"]'),
      bottom: board.querySelector('[data-zone="bottom"]'),
    };
    let drag = null;
    let scrollRaf = 0;
    let lastPointer = null;

    function cardScore(card) {
      const zone = card.parentElement && card.parentElement.getAttribute("data-zone");
      if (zone !== "top" && zone !== "bottom") return null;
      const fy = parseFloat(card.dataset.fy || "0.5");
      return scoreFor(zone, fy);
    }

    function paint(card) {
      const s = cardScore(card);
      const badge = card.querySelector(".card-score");
      if (badge) badge.textContent = s == null ? "" : String(s);
      card.classList.toggle("placed", s != null);
    }

    function zoneAt(clientY) {
      for (const key of ["top", "none", "bottom"]) {
        const r = zones[key].getBoundingClientRect();
        if (clientY >= r.top && clientY <= r.bottom) return key;
      }
      const topR = zones.top.getBoundingClientRect();
      return clientY < topR.top ? "top" : "bottom";
    }

    function placeIn(card, zone, clientX, clientY) {
      const z = zones[zone];
      if (zone === "none") {
        card.style.left = card.style.top = "";
        delete card.dataset.fx;
        delete card.dataset.fy;
        z.appendChild(card);
      } else {
        z.appendChild(card);
        const r = z.getBoundingClientRect();
        const w = card.offsetWidth, h = card.offsetHeight;
        // Keep the whole card inside the zone; store the centre as fractions.
        const cx = clamp(clientX - r.left, w / 2, r.width - w / 2);
        const cy = clamp(clientY - r.top, h / 2, r.height - h / 2);
        const fx = r.width > w ? (cx - w / 2) / (r.width - w) : 0;
        const fy = r.height > h ? (cy - h / 2) / (r.height - h) : 0.5;
        card.dataset.fx = fx.toFixed(4);
        card.dataset.fy = fy.toFixed(4);
        card.style.left = `calc(${(fx * 100).toFixed(2)}% - ${(fx * w).toFixed(1)}px)`;
        card.style.top = `calc(${(fy * 100).toFixed(2)}% - ${(fy * h).toFixed(1)}px)`;
      }
      paint(card);
    }

    function autoScroll() {
      scrollRaf = 0;
      if (!drag || !lastPointer) return;
      const edge = 70, y = lastPointer.y, vh = window.innerHeight;
      let dy = 0;
      if (y < edge) dy = -Math.ceil((edge - y) / 5);
      else if (y > vh - edge) dy = Math.ceil((y - (vh - edge)) / 5);
      if (dy) {
        window.scrollBy(0, dy);
        scrollRaf = requestAnimationFrame(autoScroll);
      }
    }

    function onDown(e) {
      const card = e.target.closest(".board-card");
      if (!card || !board.contains(card) || (e.button != null && e.button !== 0)) return;
      e.preventDefault();
      const r = card.getBoundingClientRect();
      drag = { card, dx: e.clientX - (r.left + r.width / 2), dy: e.clientY - (r.top + r.height / 2), id: e.pointerId };
      card.setPointerCapture && card.setPointerCapture(e.pointerId);
      card.classList.add("dragging");
      card.style.width = r.width + "px";
      card.style.position = "fixed";
      card.style.left = r.left + "px";
      card.style.top = r.top + "px";
      lastPointer = { x: e.clientX, y: e.clientY };
    }

    function onMove(e) {
      if (!drag || e.pointerId !== drag.id) return;
      e.preventDefault();
      const c = drag.card;
      c.style.left = e.clientX - drag.dx - c.offsetWidth / 2 + "px";
      c.style.top = e.clientY - drag.dy - c.offsetHeight / 2 + "px";
      lastPointer = { x: e.clientX, y: e.clientY };
      const z = zoneAt(e.clientY - drag.dy);
      for (const k in zones) zones[k].classList.toggle("drop-target", k === z);
      if (!scrollRaf) scrollRaf = requestAnimationFrame(autoScroll);
    }

    function onUp(e) {
      if (!drag || e.pointerId !== drag.id) return;
      const c = drag.card;
      const cx = e.clientX - drag.dx, cy = e.clientY - drag.dy;
      c.classList.remove("dragging");
      c.style.position = c.style.width = "";
      for (const k in zones) zones[k].classList.remove("drop-target");
      placeIn(c, zoneAt(cy), cx, cy);
      drag = null;
      if (onChange) onChange();
    }

    board.addEventListener("pointerdown", onDown);
    board.addEventListener("pointermove", onMove);
    board.addEventListener("pointerup", onUp);
    board.addEventListener("pointercancel", onUp);
    board.querySelectorAll(".board-card").forEach(paint);

    return {
      // [{name, score}] for every card placed outside "no idea".
      scores() {
        return Array.from(board.querySelectorAll(".board-card"))
          .map((c) => ({ name: decodeURIComponent(c.getAttribute("data-name") || ""), score: cardScore(c) }))
          .filter((x) => x.score != null);
      },
      placeIn,
      zones,
    };
  }

  window.initBoard = initBoard;
  window.boardScoreFor = scoreFor;
})();
(function () {
  const cfg = window.POLL_CONFIG;
  const root = document.getElementById("app");

  function takeFlash() {
    try {
      const raw = sessionStorage.getItem("poll_flash");
      if (!raw) return null;
      sessionStorage.removeItem("poll_flash");
      return JSON.parse(raw);
    } catch (_) {
      return null;
    }
  }

  function pushFlash(msg, cat) {
    try {
      sessionStorage.setItem("poll_flash", JSON.stringify({ msg: msg, cat: cat || "success" }));
    } catch (_) {}
  }

  function showFlash(msg, cat) {
    const el = document.getElementById("flash");
    if (!el) return;
    el.innerHTML = `<div class="flash flash-${cat || "success"}">${msg}</div>`;
    setTimeout(() => {
      if (el) el.innerHTML = "";
    }, 5000);
  }

  function applyPendingFlash() {
    const f = takeFlash();
    if (f) showFlash(f.msg, f.cat);
  }

  async function route() {
    const hash = location.hash.slice(1) || "/";
    const [path, qs] = hash.split("?");
    const params = new URLSearchParams(qs || "");
    try {
      if (path === "/" || path === "") await renderIndex();
      else if (path.startsWith("/vote/")) await renderVote(path.split("/")[2]);
      else if (path === "/admin") await renderAdmin(params.get("key") || "");
      else await renderIndex();
      applyPendingFlash();
    } catch (e) {
      root.innerHTML = `<div class="hero"><h1>Error</h1><p class="subtitle">${e.message}</p>
        <a class="back" href="#/">← Home</a></div>`;
    }
  }

  async function renderIndex() {
    document.title = cfg.TITLE;
    root.innerHTML = `<p style="color:#94a3b8;text-align:center;padding:3rem">Loading…</p>`;

    const ping = await PollStore.ping();
    const statusHtml = ping.ok
      ? `<span class="pill success">☁ Database online, votes: ${ping.count || 0}</span>`
      : `<span class="pill danger">⚠ Database unavailable, votes may not sync</span>`;

    const entries = Object.entries(cfg.TEAMS);
    const votedFlags = await PollStore.votedIds();
    const doneCount = entries.filter(([tid]) => votedFlags[tid]).length;

    const teamsHtml = entries
      .map(([tid, team], i) => {
        const done = votedFlags[tid];
        return `
        <a class="team-card ${done ? "done" : ""}"
           href="${done ? "#" : `#/vote/${tid}`}">
          <div class="team-badge">${i + 1}</div>
          <div class="team-info">
            <h2>${team.name}</h2>
            <p>${team.desc || team.members.length + " people"}</p>
          </div>
          <div class="team-action">
            ${
              done
                ? '<span class="pill success">✓ Voted</span>'
                : '<span class="pill">Let’s vote →</span>'
            }
          </div>
        </a>`;
      })
      .join("");

    root.innerHTML = `
      <div id="flash" class="flash-wrap"></div>
      <header class="hero">
        <h1>${cfg.TITLE}</h1>
        ${cfg.SUBTITLE ? `<p class="subtitle">${cfg.SUBTITLE}</p>` : ""}
        <div style="margin-top:12px">${statusHtml}
          <span class="pill">Your votes: ${doneCount} of ${entries.length}</span></div>
      </header>
      <section class="teams">${teamsHtml}</section>`;
  }

  async function renderVote(teamId) {
    const team = cfg.TEAMS[teamId];
    if (!team) {
      location.hash = "#/";
      return;
    }
    if (await PollStore.hasVoted(teamId)) {
      pushFlash("You have already voted in this poll.", "warning");
      location.hash = "#/";
      return;
    }
    document.title = team.name + " — " + cfg.TITLE;
    // Shuffle the starting order so nobody gets an edge from position in the "no idea" tray.
    const order = team.members.slice();
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const cards = order
      .map(
        (m) => `<div class="board-card" data-name="${encodeURIComponent(m)}"><span class="card-name">${m}</span><span class="card-score"></span></div>`
      )
      .join("");

    root.innerHTML = `
      <div id="flash" class="flash-wrap"></div>
      <header class="hero compact">
        <a class="back" href="#/">← Back</a>
        <h1>${team.name}</h1>
        ${team.desc ? `<p class="subtitle poll-desc">${team.desc}</p>` : ""}
        <p class="subtitle">Drag people onto the board: <strong>the higher, the better</strong>. Leave anyone you don't know in the middle, in “No idea”. Horizontal position doesn't matter.</p>
      </header>
      <div class="board" id="board">
        <div class="zone zone-top" data-zone="top"><span class="zone-label">▲ MAX · 100</span></div>
        <div class="zone zone-none" data-zone="none"><span class="zone-label">No idea / don't work with them</span>${cards}</div>
        <div class="zone zone-bottom" data-zone="bottom"><span class="zone-label zone-label-bottom">▼ MIN · 0</span></div>
      </div>
      <div class="actions sticky-actions">
        <span class="pill" id="rank-count">Rated: 0 of ${team.members.length}</span>
        <button type="button" class="btn primary" id="submit-btn">Submit</button>
      </div>`;

    const boardApi = initBoard(document.getElementById("board"), () => {
      document.getElementById("rank-count").textContent = `Rated: ${boardApi.scores().length} of ${team.members.length}`;
    });

    const btn = document.getElementById("submit-btn");
    btn.addEventListener("click", async () => {
      const scored = boardApi.scores();
      const expected = new Set(team.members);
      if (!scored.length || scored.some((x) => !expected.has(x.name))) {
        showFlash("Place at least one person on the board (above or below “No idea”).", "error");
        return;
      }
      btn.disabled = true;
      btn.textContent = "Saving…";
      try {
        await PollStore.addVote(teamId, scored, "");
        pushFlash(`Thanks! Your vote for “${team.name}” is saved.`, "success");
        location.hash = "#/";
      } catch (e) {
        btn.disabled = false;
        btn.textContent = "Submit";
        showFlash(e.message || "Could not save", "error");
      }
    });
  }

  function pluralVotes(n) {
    if (n === 0) return "no votes";
    if (n === 1) return "1 vote";
        return n + " votes";
  }

  async function renderAdmin(key) {
    if (key !== cfg.ADMIN_SECRET || !(await PollStore.isAdmin())) {
      root.innerHTML = `
        <div class="hero">
          <h1>403</h1>
          <p class="subtitle">Access denied.</p>
          <a class="back" href="#/">← Home</a>
        </div>`;
      return;
    }
    document.title = "Results — " + cfg.TITLE;
    root.innerHTML = `<p style="color:#94a3b8;text-align:center;padding:3rem">Loading results…</p>`;

    const allVotes = await PollStore.loadVotes();
    const total = await PollStore.totalBallots(allVotes);
    const ping = await PollStore.ping();
    const pollIds = Object.keys(cfg.TEAMS);
    const people = cfg.PEOPLE || cfg.TEAMS[pollIds[0]].members;
    // Per poll: average percentile score (0..100) over the ballots that ranked the person.
    const scores = {};
    const votesOf = {};
    const counts = {};
    people.forEach((p) => ((scores[p] = {}), (votesOf[p] = 0)));
    const fmt = (v) => (v == null ? "—" : String(Math.round(v)));
    const cardsParts = [];
    for (const tid of pollIds) {
      const res = await PollStore.pollScores(tid, allVotes);
      counts[tid] = res.vote_count;
      res.ranked.forEach((item) => {
        if (!scores[item.name]) return;
        scores[item.name][tid] = item.score;
        votesOf[item.name] += item.votes;
      });
      const rows =
        res.vote_count === 0
          ? `<p class="empty">No votes yet</p>`
          : `<ol class="results-list">
            ${res.ranked
              .map((item) => {
                const top = item.place <= 3 && item.score != null ? "top" : "";
                return `<li class="result-row ${top}">
                  <span class="r-place">${item.place}</span>
                  <span class="r-name">${item.name}</span>
                  <span class="r-pts"><strong>${fmt(item.score)}</strong> <small>· ${item.votes} votes</small></span>
                  <div class="r-bar-wrap"><div class="r-bar" style="width:${item.score || 0}%"></div></div>
                </li>`;
              })
              .join("")}
          </ol>`;
      cardsParts.push(`
        <section class="result-card">
          <div class="result-head">
            <h2>${res.name}</h2>
            <span class="pill">${pluralVotes(res.vote_count)}</span>
          </div>
          ${rows}
        </section>`);
    }

    // Overall = average of the person's poll scores (polls where nobody rated them are left out).
    const summary = people
      .map((name) => {
        const vals = pollIds.map((tid) => scores[name][tid]);
        const have = vals.filter((v) => v != null);
        const total = have.length ? have.reduce((a, v) => a + v, 0) / have.length : null;
        return { name, vals, total, votes: votesOf[name] };
      })
      .sort((a, b) => (b.total ?? -1) - (a.total ?? -1) || b.votes - a.votes || a.name.localeCompare(b.name));
    const summaryHtml = `
      <section class="result-card summary-card">
        <div class="result-head">
          <h2>🏆 Overall ranking</h2>
          <span class="pill">0–100: top of board = 100, bottom = 0</span>
        </div>
        <div class="table-wrap">
          <table class="summary">
            <thead><tr>
              <th>#</th><th class="l">Person</th>
              ${pollIds.map((tid) => `<th title="${cfg.TEAMS[tid].desc || ""}">${cfg.TEAMS[tid].short || cfg.TEAMS[tid].name}<br><small>${pluralVotes(counts[tid])}</small></th>`).join("")}
              <th>Total<br><small>average</small></th>
              <th>Votes<br><small>rated by</small></th>
            </tr></thead>
            <tbody>
              ${summary
                .map(
                  (row, i) => `<tr class="${i < 3 && row.total != null ? "top top" + (i + 1) : ""}">
                <td class="pl">${i + 1}</td>
                <td class="l">${row.name}</td>
                ${row.vals.map((v) => `<td>${fmt(v)}</td>`).join("")}
                <td class="tot">${fmt(row.total)}</td>
                <td class="vc">${row.votes}</td>
              </tr>`
                )
                .join("")}
            </tbody>
          </table>
        </div>
      </section>`;

    root.innerHTML = `
      <div id="flash" class="flash-wrap"></div>
      <header class="hero">
        <a class="back" href="#/">← Home</a>
        <h1>📊 Results</h1>
        <p class="subtitle">Ballots: <strong>${total}</strong> · score = height on the board: top = 100, bottom = 0 (older list ballots: 1st place = 100, last = 0); “No idea” is not counted</p>
        <p class="subtitle">${
          ping.ok
            ? "☁ Database online, ballots: " + (ping.count || 0)
            : "⚠ Database unavailable: " + (ping.error || "")
        }</p>
      </header>

      <div class="reset-box">
        <div>
          <strong>Reset the poll</strong>
          <p class="muted">Deletes ALL votes from the shared database. This cannot be undone.</p>
        </div>
        <button type="button" class="btn danger big" id="btn-reset-main">Reset the poll</button>
      </div>

      ${summaryHtml}
      <div class="admin-grid">${cardsParts.join("")}</div>`;

    async function doReset() {
      if (!confirm("DELETE ALL VOTES from the shared database? This cannot be undone.")) return;
      try {
        await PollStore.resetAll();
        pushFlash("Poll reset. All votes deleted.", "success");
        await renderAdmin(key);
        applyPendingFlash();
      } catch (e) {
        showFlash("Reset failed: " + e.message, "error");
      }
    }

    document.getElementById("btn-reset-main").onclick = doReset;
  }

  window.addEventListener("hashchange", () => {
    route();
  });
  route();
})();

  </script>
