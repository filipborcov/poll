<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рейтинг значимости участников</title>
  <style>
:root {
  --bg: #0b1020;
  --bg2: #12182b;
  --card: #1a2238;
  --border: #2a3555;
  --text: #eef2ff;
  --muted: #94a3b8;
  --primary: #6366f1;
  --primary2: #818cf8;
  --success: #22c55e;
  --warning: #eab308;
  --danger: #ef4444;
  --gold: #fbbf24;
  --silver: #94a3b8;
  --bronze: #d97706;
  --radius: 16px;
  --shadow: 0 20px 50px rgba(0,0,0,.45);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.45;
  background-image:
    radial-gradient(at 10% 0%, rgba(99,102,241,.18) 0, transparent 45%),
    radial-gradient(at 90% 100%, rgba(139,92,246,.12) 0, transparent 45%);
}

.page {
  max-width: 920px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

/* Flash */
.flash-wrap { margin-bottom: 1rem; display: flex; flex-direction: column; gap: .5rem; }
.flash {
  padding: .85rem 1rem;
  border-radius: 12px;
  font-size: .95rem;
  border: 1px solid transparent;
}
.flash-success { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.3); color: #4ade80; }
.flash-warning { background: rgba(234,179,8,.12); border-color: rgba(234,179,8,.3); color: #facc15; }
.flash-error { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.3); color: #f87171; }

/* Hero */
.hero { text-align: center; margin-bottom: 1.75rem; }
.hero.compact { text-align: left; margin-bottom: 1rem; }
.hero h1 { font-size: clamp(1.4rem, 4vw, 1.9rem); margin-bottom: .4rem; letter-spacing: -.02em; }
.subtitle { color: var(--muted); font-size: .95rem; max-width: 540px; margin: 0 auto; }
.hero.compact .subtitle { margin: 0; }
.back {
  display: inline-block;
  color: var(--primary2);
  text-decoration: none;
  font-size: .9rem;
  margin-bottom: .6rem;
}
.back:hover { text-decoration: underline; }

/* Team cards */
.teams { display: flex; flex-direction: column; gap: 1rem; }
.team-card {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.15rem 1.25rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-decoration: none;
  color: inherit;
  box-shadow: var(--shadow);
  transition: border-color .2s, transform .15s;
}
.team-card:not(.done):hover {
  border-color: var(--primary);
  transform: translateY(-2px);
}
.team-card.done { opacity: .75; cursor: default; }
.team-badge {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), #a78bfa);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.1rem; flex-shrink: 0;
}
.team-info { flex: 1; min-width: 0; }
.team-info h2 { font-size: 1.15rem; margin-bottom: .15rem; }
.team-info p { color: var(--muted); font-size: .85rem; }
.pill {
  display: inline-block;
  padding: .4rem .75rem;
  border-radius: 999px;
  background: rgba(99,102,241,.15);
  color: var(--primary2);
  font-size: .85rem;
  font-weight: 600;
  white-space: nowrap;
}
.pill.success { background: rgba(34,197,94,.15); color: #4ade80; }

/* Ranking list */
.hint-bar {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: .8rem;
  margin-bottom: .6rem;
  padding: 0 .25rem;
}
.rank-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  margin-bottom: 5.5rem;
}
.rank-item {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .85rem 1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: grab;
  user-select: none;
  transition: box-shadow .15s, border-color .15s, opacity .15s;
  touch-action: none;
}
.rank-item:active { cursor: grabbing; }
.rank-item.dragging {
  opacity: .55;
  border-color: var(--primary);
  box-shadow: 0 8px 24px rgba(99,102,241,.25);
}
.rank-item.drag-over {
  border-color: var(--primary2);
  background: rgba(99,102,241,.08);
}
.handle {
  color: var(--muted);
  font-size: 1.1rem;
  letter-spacing: -.05em;
  cursor: grab;
  flex-shrink: 0;
}
.place {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: rgba(255,255,255,.06);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: .9rem;
  color: var(--primary2);
  flex-shrink: 0;
}
.rank-item:nth-child(1) .place { background: rgba(251,191,36,.2); color: var(--gold); }
.rank-item:nth-child(2) .place { background: rgba(148,163,184,.2); color: var(--silver); }
.rank-item:nth-child(3) .place { background: rgba(217,119,6,.2); color: var(--bronze); }
.name { font-weight: 500; font-size: .98rem; }

/* Buttons */
.actions { margin-top: 1.25rem; }
.sticky-actions {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 1rem;
  background: linear-gradient(transparent, var(--bg) 30%);
  display: flex;
  justify-content: center;
  z-index: 20;
}
.btn {
  border: none;
  border-radius: 12px;
  padding: 1rem 1.5rem;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, opacity .2s;
  width: 100%;
  max-width: 420px;
}
.btn.primary {
  background: linear-gradient(135deg, var(--primary), #7c3aed);
  color: white;
  box-shadow: 0 10px 30px rgba(99,102,241,.35);
}
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:disabled { opacity: .5; cursor: not-allowed; }
.btn.danger {
  background: rgba(239,68,68,.15);
  color: #f87171;
  border: 1px solid rgba(239,68,68,.3);
  max-width: 280px;
}
.btn.danger:hover { background: rgba(239,68,68,.25); }

/* Admin */
.admin-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.25rem;
}
@media (min-width: 780px) {
  .admin-grid { grid-template-columns: 1fr 1fr; }
}
.result-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  box-shadow: var(--shadow);
}
.result-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.result-head h2 { font-size: 1.15rem; }
.empty { color: var(--muted); font-size: .95rem; padding: 1rem 0; }
.results-list { list-style: none; }
.result-row {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  grid-template-rows: auto auto;
  gap: .15rem .65rem;
  padding: .65rem 0;
  border-bottom: 1px solid rgba(255,255,255,.05);
  align-items: center;
}
.result-row:last-child { border-bottom: none; }
.r-place {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: rgba(255,255,255,.06);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .85rem;
  grid-row: 1 / 3;
}
.result-row.top:nth-child(1) .r-place { background: rgba(251,191,36,.25); color: var(--gold); }
.result-row.top:nth-child(2) .r-place { background: rgba(148,163,184,.2); color: #cbd5e1; }
.result-row.top:nth-child(3) .r-place { background: rgba(217,119,6,.2); color: var(--bronze); }
.r-name { font-weight: 500; font-size: .95rem; }
.r-pts { text-align: right; font-size: .9rem; color: var(--muted); }
.r-pts strong { color: var(--text); font-size: 1rem; }
.r-bar-wrap {
  grid-column: 2 / 4;
  height: 5px;
  background: rgba(255,255,255,.06);
  border-radius: 99px;
  overflow: hidden;
}
.r-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #a78bfa);
  border-radius: 99px;
  min-width: 2px;
}

.reset-box {
  margin-top: 2rem;
  display: flex;
  justify-content: center;
}

.foot {
  margin-top: 2rem;
  text-align: center;
  color: var(--muted);
  font-size: .85rem;
}
.foot code {
  background: rgba(255,255,255,.06);
  padding: .15rem .4rem;
  border-radius: 6px;
  font-size: .8rem;
}

/* SPA extras */
.hidden { display: none !important; }
.admin-link {
  display: inline-block;
  margin-top: 1rem;
  color: var(--muted);
  font-size: .8rem;
  text-decoration: none;
}
.admin-link:hover { color: var(--primary2); }
.import-box {
  margin-top: 1.5rem;
  padding: 1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.import-box textarea {
  width: 100%;
  min-height: 100px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: .75rem;
  font-family: ui-monospace, monospace;
  font-size: .8rem;
  margin: .5rem 0;
  resize: vertical;
}
.import-box .row {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
}
.btn.secondary {
  background: rgba(99,102,241,.15);
  color: var(--primary2);
  border: 1px solid rgba(99,102,241,.3);
  max-width: none;
  width: auto;
  padding: .65rem 1rem;
  font-size: .9rem;
}
.note-banner {
  background: rgba(234,179,8,.1);
  border: 1px solid rgba(234,179,8,.25);
  color: #facc15;
  padding: .75rem 1rem;
  border-radius: 12px;
  font-size: .85rem;
  margin-bottom: 1.25rem;
}

/* voter name + reset box */
.voter-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin: 0 0 14px;
}
.voter-box label {
  display: block;
  font-size: 0.9rem;
  margin-bottom: 8px;
  color: var(--muted);
}
.voter-box input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 1rem;
}
.voter-box input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99,102,241,.25);
}
.muted { color: var(--muted); font-weight: 400; }

.reset-box {
  display: flex;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
  background: rgba(239,68,68,.08);
  border: 1px solid rgba(239,68,68,.35);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 18px;
}
.reset-box .muted { margin-top: 4px; font-size: 0.9rem; }
.btn.big { padding: 14px 22px; font-size: 1.05rem; font-weight: 700; }
.pill.danger {
  background: rgba(239,68,68,.15);
  color: #f87171;
  border: 1px solid rgba(239,68,68,.3);
}

@media (max-width: 640px) {
  .reset-box { flex-direction: column; align-items: stretch; }
}

  </style>
</head>
<body>
  <div class="page"><div id="app"><p style="color:#94a3b8;text-align:center;padding:3rem">Загрузка…</p></div></div>
  <script>
window.POLL_CONFIG = {
  ADMIN_SECRET: "rank2026admin",
  TITLE: "Рейтинг значимости участников",
  SUBTITLE: "Расставьте всех участников команды от самого значимого к менее значимому. Один голос на команду.",
  API_BASE: "",
  VOTES_URL: "https://crudcrud.com/api/c7458f43fa864775b1b4232a82673e61/votes",
  TEAMS: {
    team1: {
      name: "Команда А",
      members: [
        "Алексей Иванов",
        "Мария Петрова",
        "Дмитрий Сидоров",
        "Анна Козлова",
        "Сергей Новиков",
        "Елена Морозова",
        "Игорь Волков",
        "Ольга Соколова",
        "Павел Лебедев",
        "Наталья Кузнецова",
        "Андрей Попов",
        "Юлия Васильева",
        "Максим Михайлов",
        "Екатерина Фёдорова",
        "Артём Смирнов",
      ],
    },
    team2: {
      name: "Команда Б",
      members: [
        "Владимир Орлов",
        "Татьяна Николаева",
        "Роман Алексеев",
        "Ирина Павлова",
        "Кирилл Семёнов",
        "Светлана Егорова",
        "Денис Степанов",
        "Виктория Зайцева",
        "Никита Григорьев",
        "Алина Романова",
        "Глеб Борисов",
        "Дарья Ковалёва",
        "Тимур Медведев",
        "Полина Ершова",
        "Станислав Тимофеев",
      ],
    },
  },
};
(function () {
  const LOCAL_KEY = "team-rank-poll-v4";
  const DEVICE_KEY = "team-rank-poll-device";

  function getDeviceId() {
    let id = localStorage.getItem(DEVICE_KEY);
    if (!id) {
      id = "d_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      try { localStorage.setItem(DEVICE_KEY, id); } catch (_) {}
    }
    return id;
  }

  function cfg() { return window.POLL_CONFIG || {}; }

  function votesUrl() { return cfg().VOTES_URL || ""; }

  function cacheGet() {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return { votes: [] };
  }

  function cacheSet(votes) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ votes: votes })); } catch (_) {}
  }

  /** ranking names -> "0,3,1,2,..." compact string (cloud rejects large arrays) */
  function encodeRanking(teamId, ranking) {
    const members = (cfg().TEAMS[teamId] || {}).members || [];
    const idx = ranking.map((name) => {
      const i = members.indexOf(name);
      if (i < 0) throw new Error("Неизвестный участник: " + name);
      return i;
    });
    return idx.join(",");
  }

  function decodeRanking(teamId, r) {
    const members = (cfg().TEAMS[teamId] || {}).members || [];
    if (Array.isArray(r)) {
      // legacy: full names or indices
      if (typeof r[0] === "number") return r.map((i) => members[i]).filter(Boolean);
      return r;
    }
    if (typeof r === "string") {
      return r.split(",").map((s) => members[parseInt(s, 10)]).filter(Boolean);
    }
    return [];
  }

  function normalizeVote(raw) {
    // compact cloud format: {t,r,ts,d,n,_id} or full {team_id,ranking,...}
    const team_id = raw.team_id || raw.t;
    const device = raw.device || raw.d || "";
    const name = raw.name || raw.n || "";
    const ts = raw.ts || 0;
    const ranking = decodeRanking(team_id, raw.ranking != null ? raw.ranking : raw.r);
    return { team_id, ranking, ts, device, name, _id: raw._id };
  }

  async function cloudList() {
    const url = votesUrl();
    if (!url) throw new Error("VOTES_URL missing");
    const res = await fetch(url + "?_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("Не удалось загрузить голоса (" + res.status + ")");
    const arr = await res.json();
    if (!Array.isArray(arr)) return [];
    return arr.map(normalizeVote).filter((v) => v.team_id && v.ranking && v.ranking.length);
  }

  async function cloudPost(teamId, ranking, device, voterName) {
    const url = votesUrl();
    if (!url) throw new Error("VOTES_URL missing");
    // COMPACT body only — large JSON arrays get HTTP 500 on free cloud
    const body = {
      t: teamId,
      r: encodeRanking(teamId, ranking),
      ts: Date.now(),
      d: device,
      n: String(voterName || "").slice(0, 60),
    };
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const t = await res.text().catch(() => "");
      throw new Error("Сохранение не удалось (" + res.status + ") " + t.slice(0, 60));
    }
    return res.json();
  }

  async function cloudReset() {
    const url = votesUrl();
    const list = await cloudList();
    // re-fetch raw for ids
    const res = await fetch(url + "?_=" + Date.now(), { cache: "no-store" });
    const arr = await res.json();
    if (!Array.isArray(arr)) return;
    for (const v of arr) {
      if (v._id) {
        await fetch(url + "/" + v._id, { method: "DELETE" }).catch(() => {});
      }
    }
  }

  // optional same-origin API
  async function apiGet() {
    try {
      const res = await fetch("/api/votes", { cache: "no-store" });
      if (res.status === 503 || res.status === 404) return null;
      if (!res.ok) return null;
      const data = await res.json();
      return Array.isArray(data.votes) ? data.votes.map(normalizeVote) : [];
    } catch (_) {
      return null;
    }
  }

  async function apiPost(vote) {
    try {
      const res = await fetch("/api/vote", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(vote),
      });
      if (res.status === 503 || res.status === 404) return null;
      const data = await res.json().catch(() => ({}));
      if (res.status === 409) {
        const err = new Error(data.message || "Уже голосовали");
        err.code = "ALREADY";
        throw err;
      }
      if (!res.ok) return null;
      return data;
    } catch (e) {
      if (e.code === "ALREADY") throw e;
      return null;
    }
  }

  async function apiReset(key) {
    try {
      const res = await fetch("/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Admin-Key": key },
        body: JSON.stringify({ key }),
      });
      if (res.status === 503 || res.status === 404) return null;
      return res.ok;
    } catch (_) {
      return null;
    }
  }

  let mode = "unknown";

  async function loadVotes() {
    const apiVotes = await apiGet();
    if (apiVotes) {
      mode = "api";
      cacheSet(apiVotes);
      return apiVotes;
    }
    const cloud = await cloudList();
    mode = "cloud";
    cacheSet(cloud);
    return cloud;
  }

  async function load() {
    return { votes: await loadVotes(), devices: {}, meta: {} };
  }

  async function hasVoted(teamId) {
    const device = getDeviceId();
    const votes = await loadVotes();
    return votes.some((v) => v.device === device && v.team_id === teamId);
  }

  async function addVote(teamId, ranking, voterName) {
    const device = getDeviceId();
    const votes = await loadVotes();
    if (votes.some((v) => v.device === device && v.team_id === teamId)) {
      const err = new Error("Вы уже голосовали за эту команду с этого устройства.");
      err.code = "ALREADY";
      throw err;
    }

    // try API with full ranking
    const full = {
      team_id: teamId,
      ranking,
      ts: Date.now(),
      device,
      name: voterName || "",
    };
    try {
      const r = await apiPost(full);
      if (r) {
        mode = "api";
        cacheSet(await loadVotes());
        return;
      }
    } catch (e) {
      if (e.code === "ALREADY") throw e;
    }

    // cloud compact
    await cloudPost(teamId, ranking, device, voterName);
    mode = "cloud";
    const all = await loadVotes();
    cacheSet(all);
  }

  async function bordaScores(teamId) {
    const team = (cfg().TEAMS || {})[teamId];
    if (!team) return { ranked: [], vote_count: 0, name: "", member_count: 0 };
    const members = team.members;
    const n = members.length;
    const scores = Object.fromEntries(members.map((m) => [m, 0]));
    let voteCount = 0;
    const votes = await loadVotes();
    for (const vote of votes) {
      if (vote.team_id !== teamId) continue;
      voteCount++;
      (vote.ranking || []).forEach((name, pos) => {
        if (name in scores) scores[name] += n - pos;
      });
    }
    const ranked = Object.entries(scores)
      .map(([name, points]) => ({ name, points }))
      .sort((a, b) => b.points - a.points || a.name.localeCompare(b.name, "ru"));
    ranked.forEach((item, i) => {
      item.place = i + 1;
      item.max_points = n * voteCount;
    });
    return { ranked, vote_count: voteCount, name: team.name, member_count: n };
  }

  async function resetAll() {
    const key = cfg().ADMIN_SECRET;
    const ok = await apiReset(key);
    if (!ok) await cloudReset();
    cacheSet([]);
  }

  async function totalBallots() {
    return (await loadVotes()).length;
  }

  function exportJSON() {
    return JSON.stringify({ votes: cacheGet().votes || [] }, null, 2);
  }

  async function importJSON(raw) {
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.votes)) throw new Error("Неверный формат");
    let added = 0;
    const existing = await loadVotes();
    const seen = new Set(existing.map((v) => v.team_id + "|" + v.ts + "|" + v.device));
    for (const v of data.votes) {
      const k = (v.team_id || v.t) + "|" + (v.ts || 0) + "|" + (v.device || v.d || "");
      if (seen.has(k)) continue;
      const teamId = v.team_id || v.t;
      const ranking = decodeRanking(teamId, v.ranking != null ? v.ranking : v.r);
      if (!teamId || !ranking.length) continue;
      try {
        await cloudPost(teamId, ranking, v.device || v.d || "import", v.name || v.n || "");
        added++;
      } catch (_) {}
    }
    return added;
  }

  async function ping() {
    try {
      const apiVotes = await apiGet();
      if (apiVotes) return { ok: true, mode: "api", count: apiVotes.length };
    } catch (_) {}
    try {
      const votes = await cloudList();
      return { ok: true, mode: "cloud", count: votes.length };
    } catch (e) {
      return { ok: false, mode: "local", error: String(e.message || e) };
    }
  }

  window.PollStore = {
    load,
    loadVotes,
    hasVoted,
    addVote,
    bordaScores,
    resetAll,
    exportJSON,
    importJSON,
    totalBallots,
    getDeviceId,
    ping,
    getMode: () => mode,
    cacheGet,
  };
})();
(function () {
  function initSortable(list) {
    if (!list) return;
    let dragEl = null;

    function renumber() {
      list.querySelectorAll(".rank-item").forEach((li, i) => {
        const place = li.querySelector(".place");
        if (place) place.textContent = String(i + 1);
      });
    }

    list.querySelectorAll(".rank-item").forEach((item) => {
      item.addEventListener("dragstart", (e) => {
        dragEl = item;
        item.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", decodeURIComponent(item.getAttribute("data-name") || ""));
      });
      item.addEventListener("dragend", () => {
        item.classList.remove("dragging");
        list.querySelectorAll(".rank-item").forEach((el) => el.classList.remove("drag-over"));
        dragEl = null;
        renumber();
      });
      item.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        const target = e.currentTarget;
        if (!dragEl || target === dragEl) return;
        target.classList.add("drag-over");
        const rect = target.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        if (e.clientY < mid) list.insertBefore(dragEl, target);
        else list.insertBefore(dragEl, target.nextSibling);
        renumber();
      });
      item.addEventListener("dragleave", (e) => {
        e.currentTarget.classList.remove("drag-over");
      });
      item.addEventListener("drop", (e) => {
        e.preventDefault();
        e.currentTarget.classList.remove("drag-over");
        renumber();
      });
    });

    let touchItem = null;
    list.querySelectorAll(".rank-item").forEach((item) => {
      item.addEventListener(
        "touchstart",
        () => {
          touchItem = item;
          item.classList.add("dragging");
        },
        { passive: true }
      );
    });
    list.addEventListener(
      "touchmove",
      (e) => {
        if (!touchItem) return;
        e.preventDefault();
        const touch = e.touches[0];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        const target = el && el.closest(".rank-item");
        if (target && target !== touchItem && list.contains(target)) {
          const rect = target.getBoundingClientRect();
          const mid = rect.top + rect.height / 2;
          if (touch.clientY < mid) list.insertBefore(touchItem, target);
          else list.insertBefore(touchItem, target.nextSibling);
          renumber();
        }
      },
      { passive: false }
    );
    list.addEventListener(
      "touchend",
      () => {
        if (touchItem) {
          touchItem.classList.remove("dragging");
          touchItem = null;
          renumber();
        }
      },
      { passive: true }
    );
  }

  window.initSortable = initSortable;
  window.getRanking = function (list) {
    return Array.from(list.querySelectorAll(".rank-item")).map((li) =>
      decodeURIComponent(li.getAttribute("data-name") || "")
    );
  };
})();
(function () {
  const cfg = window.POLL_CONFIG;
  const root = document.getElementById("app");

  function takeFlash() {
    try {
      const raw = sessionStorage.getItem("poll_flash");
      if (!raw) return null;
      sessionStorage.removeItem("poll_flash");
      return JSON.parse(raw);
    } catch (_) {
      return null;
    }
  }

  function pushFlash(msg, cat) {
    try {
      sessionStorage.setItem("poll_flash", JSON.stringify({ msg: msg, cat: cat || "success" }));
    } catch (_) {}
  }

  function showFlash(msg, cat) {
    const el = document.getElementById("flash");
    if (!el) return;
    el.innerHTML = `<div class="flash flash-${cat || "success"}">${msg}</div>`;
    setTimeout(() => {
      if (el) el.innerHTML = "";
    }, 5000);
  }

  function applyPendingFlash() {
    const f = takeFlash();
    if (f) showFlash(f.msg, f.cat);
  }

  async function route() {
    const hash = location.hash.slice(1) || "/";
    const [path, qs] = hash.split("?");
    const params = new URLSearchParams(qs || "");
    try {
      if (path === "/" || path === "") await renderIndex();
      else if (path.startsWith("/vote/")) await renderVote(path.split("/")[2]);
      else if (path === "/admin") await renderAdmin(params.get("key") || "");
      else await renderIndex();
      applyPendingFlash();
    } catch (e) {
      root.innerHTML = `<div class="hero"><h1>Ошибка</h1><p class="subtitle">${e.message}</p>
        <a class="back" href="#/">← На главную</a></div>`;
    }
  }

  async function renderIndex() {
    document.title = cfg.TITLE;
    root.innerHTML = `<p style="color:#94a3b8;text-align:center;padding:3rem">Загрузка…</p>`;

    const ping = await PollStore.ping();
    const statusHtml = ping.ok
      ? `<span class="pill success">☁ Общая база подключена (${ping.mode}, голосов: ${ping.count || 0})</span>`
      : `<span class="pill danger">⚠ База недоступна — голоса могут не синхронизироваться</span>`;

    const entries = Object.entries(cfg.TEAMS);
    const votedFlags = {};
    for (const [tid] of entries) {
      votedFlags[tid] = await PollStore.hasVoted(tid);
    }

    const teamsHtml = entries
      .map(([tid, team], i) => {
        const done = votedFlags[tid];
        return `
        <a class="team-card ${done ? "done" : ""}"
           href="${done ? "#" : `#/vote/${tid}`}">
          <div class="team-badge">${i + 1}</div>
          <div class="team-info">
            <h2>${team.name}</h2>
            <p>${team.members.length} участников</p>
          </div>
          <div class="team-action">
            ${
              done
                ? '<span class="pill success">✓ Голос учтён</span>'
                : '<span class="pill">Ранжировать →</span>'
            }
          </div>
        </a>`;
      })
      .join("");

    root.innerHTML = `
      <div id="flash" class="flash-wrap"></div>
      <header class="hero">
        <h1>${cfg.TITLE}</h1>
        <p class="subtitle">${cfg.SUBTITLE}</p>
        <div style="margin-top:12px">${statusHtml}</div>
      </header>
      <section class="teams">${teamsHtml}</section>
      <footer class="foot">
        <p>Один голос на команду с этого устройства. Расставьте всех от <strong>самого значимого</strong> (верх) к менее значимому (низ).</p>
        <a class="admin-link" href="#/admin?key=${encodeURIComponent(cfg.ADMIN_SECRET)}">Результаты (админ)</a>
      </footer>`;
  }

  async function renderVote(teamId) {
    const team = cfg.TEAMS[teamId];
    if (!team) {
      location.hash = "#/";
      return;
    }
    if (await PollStore.hasVoted(teamId)) {
      pushFlash("Вы уже проголосовали за эту команду.", "warning");
      location.hash = "#/";
      return;
    }
    document.title = team.name + " — " + cfg.TITLE;
    const items = team.members
      .map(
        (m, i) => `
      <li class="rank-item" data-name="${encodeURIComponent(m)}" draggable="true">
        <span class="handle" title="Перетащить">⠿</span>
        <span class="place">${i + 1}</span>
        <span class="name">${m}</span>
      </li>`
      )
      .join("");

    root.innerHTML = `
      <div id="flash" class="flash-wrap"></div>
      <header class="hero compact">
        <a class="back" href="#/">← Назад</a>
        <h1>${team.name}</h1>
        <p class="subtitle">Перетащите карточки: <strong>1 место = самый значимый</strong>. Обязательно расставьте всех.</p>
      </header>
      <div class="voter-box">
        <label for="voter-name">Ваше имя <span class="muted">(необязательно)</span></label>
        <input id="voter-name" type="text" placeholder="Как вас записать в журнал голосов" maxlength="80" />
      </div>
      <div class="hint-bar">
        <span>↑ Более значимый</span>
        <span>${team.members.length} / ${team.members.length}</span>
        <span>Менее значимый ↓</span>
      </div>
      <ul id="sortable" class="rank-list" aria-label="Список для ранжирования">
        ${items}
      </ul>
      <div class="actions sticky-actions">
        <button type="button" class="btn primary" id="submit-btn">Отправить рейтинг</button>
      </div>`;

    const list = document.getElementById("sortable");
    initSortable(list);
    const btn = document.getElementById("submit-btn");
    btn.addEventListener("click", async () => {
      const ranking = getRanking(list);
      const expected = new Set(team.members);
      if (ranking.length !== expected.size || ranking.some((n) => !expected.has(n))) {
        showFlash("Нужно расставить ВСЕХ участников.", "error");
        return;
      }
      const voterName = (document.getElementById("voter-name").value || "").trim();
      btn.disabled = true;
      btn.textContent = "Сохраняем…";
      try {
        await PollStore.addVote(teamId, ranking, voterName);
        pushFlash(`Спасибо! Голос за «${team.name}» сохранён в общую базу.`, "success");
        location.hash = "#/";
      } catch (e) {
        btn.disabled = false;
        btn.textContent = "Отправить рейтинг";
        showFlash(e.message || "Ошибка сохранения", "error");
      }
    });
  }

  function pluralVotes(n) {
    if (n === 0) return "нет голосов";
    if (n === 1) return "1 голос";
    if (n >= 2 && n <= 4) return n + " голоса";
    return n + " голосов";
  }

  async function renderAdmin(key) {
    if (key !== cfg.ADMIN_SECRET) {
      root.innerHTML = `
        <div class="hero">
          <h1>403</h1>
          <p class="subtitle">Неверный ключ. Откройте <code>/#/admin?key=…</code></p>
          <a class="back" href="#/">← На главную</a>
        </div>`;
      return;
    }
    document.title = "Результаты — " + cfg.TITLE;
    root.innerHTML = `<p style="color:#94a3b8;text-align:center;padding:3rem">Загрузка результатов…</p>`;

    const total = await PollStore.totalBallots();
    const ping = await PollStore.ping();
    const cardsParts = [];
    for (const tid of Object.keys(cfg.TEAMS)) {
      const res = await PollStore.bordaScores(tid);
      const rows =
        res.vote_count === 0
          ? `<p class="empty">Пока нет голосов</p>`
          : `<ol class="results-list">
            ${res.ranked
              .map((item) => {
                const pct = item.max_points ? (item.points / item.max_points) * 100 : 0;
                const top = item.place <= 3 ? "top" : "";
                return `<li class="result-row ${top}">
                  <span class="r-place">${item.place}</span>
                  <span class="r-name">${item.name}</span>
                  <span class="r-pts"><strong>${item.points}</strong> <small>очк.</small></span>
                  <div class="r-bar-wrap"><div class="r-bar" style="width:${pct}%"></div></div>
                </li>`;
              })
              .join("")}
          </ol>`;
      cardsParts.push(`
        <section class="result-card">
          <div class="result-head">
            <h2>${res.name}</h2>
            <span class="pill">${pluralVotes(res.vote_count)}</span>
          </div>
          ${rows}
        </section>`);
    }

    root.innerHTML = `
      <div id="flash" class="flash-wrap"></div>
      <header class="hero">
        <a class="back" href="#/">← На главную</a>
        <h1>📊 Результаты</h1>
        <p class="subtitle">Всего бюллетеней: <strong>${total}</strong> · Borda: 1 место = N очков, последнее = 1</p>
        <p class="subtitle">${
          ping.ok
            ? "☁ Общая база (" + ping.mode + "), бюллетеней в базе: " + (ping.count || 0)
            : "⚠ Облако недоступно: " + (ping.error || "")
        }</p>
      </header>

      <div class="reset-box">
        <div>
          <strong>Скинуть голосование</strong>
          <p class="muted">Удалит ВСЕ голоса из общей базы. Действие необратимо.</p>
        </div>
        <button type="button" class="btn danger big" id="btn-reset-main">Скинуть голосование</button>
      </div>

      <div class="admin-grid">${cardsParts.join("")}</div>
      <div class="import-box">
        <strong>Экспорт / импорт (резервная копия)</strong>
        <textarea id="io-json" placeholder="JSON голосов…"></textarea>
        <div class="row">
          <button type="button" class="btn secondary" id="btn-export">Экспорт</button>
          <button type="button" class="btn secondary" id="btn-import">Импорт (merge)</button>
          <button type="button" class="btn danger" id="btn-reset">Скинуть голосование</button>
        </div>
      </div>
      <footer class="foot">
        <p>Админ-ссылка: <code>/#/admin?key=${cfg.ADMIN_SECRET}</code></p>
      </footer>`;

    async function doReset() {
      if (!confirm("СКИНУТЬ ВСЕ ГОЛОСА из общей базы? Это нельзя отменить.")) return;
      try {
        await PollStore.resetAll();
        pushFlash("Голосование сброшено. Все голоса удалены.", "success");
        await renderAdmin(key);
        applyPendingFlash();
      } catch (e) {
        showFlash("Ошибка сброса: " + e.message, "error");
      }
    }

    document.getElementById("btn-reset-main").onclick = doReset;
    document.getElementById("btn-reset").onclick = doReset;

    document.getElementById("btn-export").onclick = async () => {
      try {
        const d = await PollStore.load();
        document.getElementById("io-json").value = JSON.stringify(d, null, 2);
        showFlash("Экспортировано.", "success");
      } catch (e) {
        showFlash(e.message, "error");
      }
    };
    document.getElementById("btn-import").onclick = async () => {
      try {
        const n = await PollStore.importJSON(document.getElementById("io-json").value);
        showFlash(`Добавлено новых голосов: ${n}`, "success");
        await renderAdmin(key);
        applyPendingFlash();
      } catch (e) {
        showFlash("Ошибка импорта: " + e.message, "error");
      }
    };
  }

  window.addEventListener("hashchange", () => {
    route();
  });
  route();
})();

  </script>
</body>
