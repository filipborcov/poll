<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рейтинг значимости участников</title>
  <meta name="description" content="Team Rank Poll">
  <style>
:root {
  --bg: #0b1020;
  --bg2: #12182b;
  --card: #1a2238;
  --border: #2a3555;
  --text: #eef2ff;
  --muted: #94a3b8;
  --primary: #6366f1;
  --primary2: #818cf8;
  --success: #22c55e;
  --warning: #eab308;
  --danger: #ef4444;
  --gold: #fbbf24;
  --silver: #94a3b8;
  --bronze: #d97706;
  --radius: 16px;
  --shadow: 0 20px 50px rgba(0,0,0,.45);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.45;
  background-image:
    radial-gradient(at 10% 0%, rgba(99,102,241,.18) 0, transparent 45%),
    radial-gradient(at 90% 100%, rgba(139,92,246,.12) 0, transparent 45%);
}

.page {
  max-width: 920px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

/* Flash */
.flash-wrap { margin-bottom: 1rem; display: flex; flex-direction: column; gap: .5rem; }
.flash {
  padding: .85rem 1rem;
  border-radius: 12px;
  font-size: .95rem;
  border: 1px solid transparent;
}
.flash-success { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.3); color: #4ade80; }
.flash-warning { background: rgba(234,179,8,.12); border-color: rgba(234,179,8,.3); color: #facc15; }
.flash-error { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.3); color: #f87171; }

/* Hero */
.hero { text-align: center; margin-bottom: 1.75rem; }
.hero.compact { text-align: left; margin-bottom: 1rem; }
.hero h1 { font-size: clamp(1.4rem, 4vw, 1.9rem); margin-bottom: .4rem; letter-spacing: -.02em; }
.subtitle { color: var(--muted); font-size: .95rem; max-width: 540px; margin: 0 auto; }
.hero.compact .subtitle { margin: 0; }
.back {
  display: inline-block;
  color: var(--primary2);
  text-decoration: none;
  font-size: .9rem;
  margin-bottom: .6rem;
}
.back:hover { text-decoration: underline; }

/* Team cards */
.teams { display: flex; flex-direction: column; gap: 1rem; }
.team-card {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.15rem 1.25rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-decoration: none;
  color: inherit;
  box-shadow: var(--shadow);
  transition: border-color .2s, transform .15s;
}
.team-card:not(.done):hover {
  border-color: var(--primary);
  transform: translateY(-2px);
}
.team-card.done { opacity: .75; cursor: default; }
.team-badge {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), #a78bfa);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.1rem; flex-shrink: 0;
}
.team-info { flex: 1; min-width: 0; }
.team-info h2 { font-size: 1.15rem; margin-bottom: .15rem; }
.team-info p { color: var(--muted); font-size: .85rem; }
.pill {
  display: inline-block;
  padding: .4rem .75rem;
  border-radius: 999px;
  background: rgba(99,102,241,.15);
  color: var(--primary2);
  font-size: .85rem;
  font-weight: 600;
  white-space: nowrap;
}
.pill.success { background: rgba(34,197,94,.15); color: #4ade80; }

/* Ranking list */
.hint-bar {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: .8rem;
  margin-bottom: .6rem;
  padding: 0 .25rem;
}
.rank-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  margin-bottom: 5.5rem;
}
.rank-item {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .85rem 1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: grab;
  user-select: none;
  transition: box-shadow .15s, border-color .15s, opacity .15s;
  touch-action: none;
}
.rank-item:active { cursor: grabbing; }
.rank-item.dragging {
  opacity: .55;
  border-color: var(--primary);
  box-shadow: 0 8px 24px rgba(99,102,241,.25);
}
.rank-item.drag-over {
  border-color: var(--primary2);
  background: rgba(99,102,241,.08);
}
.handle {
  color: var(--muted);
  font-size: 1.1rem;
  letter-spacing: -.05em;
  cursor: grab;
  flex-shrink: 0;
}
.place {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: rgba(255,255,255,.06);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: .9rem;
  color: var(--primary2);
  flex-shrink: 0;
}
.rank-item:nth-child(1) .place { background: rgba(251,191,36,.2); color: var(--gold); }
.rank-item:nth-child(2) .place { background: rgba(148,163,184,.2); color: var(--silver); }
.rank-item:nth-child(3) .place { background: rgba(217,119,6,.2); color: var(--bronze); }
.name { font-weight: 500; font-size: .98rem; }

/* Buttons */
.actions { margin-top: 1.25rem; }
.sticky-actions {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 1rem;
  background: linear-gradient(transparent, var(--bg) 30%);
  display: flex;
  justify-content: center;
  z-index: 20;
}
.btn {
  border: none;
  border-radius: 12px;
  padding: 1rem 1.5rem;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, opacity .2s;
  width: 100%;
  max-width: 420px;
}
.btn.primary {
  background: linear-gradient(135deg, var(--primary), #7c3aed);
  color: white;
  box-shadow: 0 10px 30px rgba(99,102,241,.35);
}
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:disabled { opacity: .5; cursor: not-allowed; }
.btn.danger {
  background: rgba(239,68,68,.15);
  color: #f87171;
  border: 1px solid rgba(239,68,68,.3);
  max-width: 280px;
}
.btn.danger:hover { background: rgba(239,68,68,.25); }

/* Admin */
.admin-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.25rem;
}
@media (min-width: 780px) {
  .admin-grid { grid-template-columns: 1fr 1fr; }
}
.result-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  box-shadow: var(--shadow);
}
.result-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.result-head h2 { font-size: 1.15rem; }
.empty { color: var(--muted); font-size: .95rem; padding: 1rem 0; }
.results-list { list-style: none; }
.result-row {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  grid-template-rows: auto auto;
  gap: .15rem .65rem;
  padding: .65rem 0;
  border-bottom: 1px solid rgba(255,255,255,.05);
  align-items: center;
}
.result-row:last-child { border-bottom: none; }
.r-place {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: rgba(255,255,255,.06);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .85rem;
  grid-row: 1 / 3;
}
.result-row.top:nth-child(1) .r-place { background: rgba(251,191,36,.25); color: var(--gold); }
.result-row.top:nth-child(2) .r-place { background: rgba(148,163,184,.2); color: #cbd5e1; }
.result-row.top:nth-child(3) .r-place { background: rgba(217,119,6,.2); color: var(--bronze); }
.r-name { font-weight: 500; font-size: .95rem; }
.r-pts { text-align: right; font-size: .9rem; color: var(--muted); }
.r-pts strong { color: var(--text); font-size: 1rem; }
.r-bar-wrap {
  grid-column: 2 / 4;
  height: 5px;
  background: rgba(255,255,255,.06);
  border-radius: 99px;
  overflow: hidden;
}
.r-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #a78bfa);
  border-radius: 99px;
  min-width: 2px;
}

.reset-box {
  margin-top: 2rem;
  display: flex;
  justify-content: center;
}

.foot {
  margin-top: 2rem;
  text-align: center;
  color: var(--muted);
  font-size: .85rem;
}
.foot code {
  background: rgba(255,255,255,.06);
  padding: .15rem .4rem;
  border-radius: 6px;
  font-size: .8rem;
}

/* SPA extras */
.hidden { display: none !important; }
.admin-link {
  display: inline-block;
  margin-top: 1rem;
  color: var(--muted);
  font-size: .8rem;
  text-decoration: none;
}
.admin-link:hover { color: var(--primary2); }
.import-box {
  margin-top: 1.5rem;
  padding: 1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.import-box textarea {
  width: 100%;
  min-height: 100px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: .75rem;
  font-family: ui-monospace, monospace;
  font-size: .8rem;
  margin: .5rem 0;
  resize: vertical;
}
.import-box .row {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
}
.btn.secondary {
  background: rgba(99,102,241,.15);
  color: var(--primary2);
  border: 1px solid rgba(99,102,241,.3);
  max-width: none;
  width: auto;
  padding: .65rem 1rem;
  font-size: .9rem;
}
.note-banner {
  background: rgba(234,179,8,.1);
  border: 1px solid rgba(234,179,8,.25);
  color: #facc15;
  padding: .75rem 1rem;
  border-radius: 12px;
  font-size: .85rem;
  margin-bottom: 1.25rem;
}

  </style>
</head>
<body>
  <div class="page">
    <div id="app">
      <p style="color:#94a3b8;text-align:center;padding:3rem">Загрузка…</p>
    </div>
  </div>
  <script>
// ============================================================
//  НАСТРОЙКИ ОПРОСА — редактируйте здесь
// ============================================================
window.POLL_CONFIG = {
  ADMIN_SECRET: "rank2026admin",
  TITLE: "Рейтинг значимости участников",
  SUBTITLE: "Расставьте всех участников команды от самого значимого к менее значимому. Один голос на команду.",
  TEAMS: {
    team1: {
      name: "Команда А",
      members: [
        "Алексей Иванов",
        "Мария Петрова",
        "Дмитрий Сидоров",
        "Анна Козлова",
        "Сергей Новиков",
        "Елена Морозова",
        "Игорь Волков",
        "Ольга Соколова",
        "Павел Лебедев",
        "Наталья Кузнецова",
        "Андрей Попов",
        "Юлия Васильева",
        "Максим Михайлов",
        "Екатерина Фёдорова",
        "Артём Смирнов",
      ],
    },
    team2: {
      name: "Команда Б",
      members: [
        "Владимир Орлов",
        "Татьяна Николаева",
        "Роман Алексеев",
        "Ирина Павлова",
        "Кирилл Семёнов",
        "Светлана Егорова",
        "Денис Степанов",
        "Виктория Зайцева",
        "Никита Григорьев",
        "Алина Романова",
        "Глеб Борисов",
        "Дарья Ковалёва",
        "Тимур Медведев",
        "Полина Ершова",
        "Станислав Тимофеев",
      ],
    },
  },
};
(function () {
  const KEY = "team-rank-poll-v1";

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return { votes: [], meta: { created: Date.now() }, votedTeams: [] };
  }

  function save(data) {
    localStorage.setItem(KEY, JSON.stringify(data));
  }

  function hasVoted(teamId) {
    const d = load();
    return (d.votedTeams || []).includes(teamId);
  }

  function markVoted(teamId) {
    const d = load();
    d.votedTeams = d.votedTeams || [];
    if (!d.votedTeams.includes(teamId)) d.votedTeams.push(teamId);
    save(d);
  }

  function addVote(teamId, ranking) {
    const d = load();
    d.votes.push({
      team_id: teamId,
      ranking: ranking,
      ts: Date.now(),
      device: getDeviceId(),
    });
    save(d);
    markVoted(teamId);
  }

  function getDeviceId() {
    let id = localStorage.getItem("team-rank-poll-device");
    if (!id) {
      id = "d_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem("team-rank-poll-device", id);
    }
    return id;
  }

  function bordaScores(teamId) {
    const cfg = window.POLL_CONFIG;
    const team = cfg.TEAMS[teamId];
    if (!team) return { ranked: [], vote_count: 0 };
    const members = team.members;
    const n = members.length;
    const scores = Object.fromEntries(members.map((m) => [m, 0]));
    let voteCount = 0;
    const data = load();
    for (const vote of data.votes || []) {
      if (vote.team_id !== teamId) continue;
      voteCount++;
      (vote.ranking || []).forEach((name, pos) => {
        if (name in scores) scores[name] += n - pos;
      });
    }
    const ranked = Object.entries(scores)
      .map(([name, points]) => ({ name, points }))
      .sort((a, b) => b.points - a.points || a.name.localeCompare(b.name, "ru"));
    ranked.forEach((item, i) => {
      item.place = i + 1;
      item.max_points = n * voteCount;
    });
    return { ranked, vote_count: voteCount, name: team.name, member_count: n };
  }

  function resetAll() {
    save({ votes: [], meta: { created: Date.now(), reset_at: Date.now() }, votedTeams: [] });
  }

  function exportJSON() {
    return JSON.stringify(load(), null, 2);
  }

  function importJSON(raw) {
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.votes)) throw new Error("Неверный формат");
    // merge votes by simple append of unique ts+device+team
    const cur = load();
    const seen = new Set(
      (cur.votes || []).map((v) => `${v.team_id}|${v.ts}|${v.device || ""}`)
    );
    let added = 0;
    for (const v of data.votes) {
      const k = `${v.team_id}|${v.ts}|${v.device || ""}`;
      if (!seen.has(k)) {
        cur.votes.push(v);
        seen.add(k);
        added++;
      }
    }
    save(cur);
    return added;
  }

  function totalBallots() {
    return (load().votes || []).length;
  }

  window.PollStore = {
    load,
    save,
    hasVoted,
    markVoted,
    addVote,
    bordaScores,
    resetAll,
    exportJSON,
    importJSON,
    totalBallots,
  };
})();
(function () {
  function initSortable(list) {
    if (!list) return;
    let dragEl = null;

    function renumber() {
      list.querySelectorAll(".rank-item").forEach((li, i) => {
        const place = li.querySelector(".place");
        if (place) place.textContent = String(i + 1);
      });
    }

    list.querySelectorAll(".rank-item").forEach((item) => {
      item.addEventListener("dragstart", (e) => {
        dragEl = item;
        item.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", decodeURIComponent(item.getAttribute("data-name") || ""));
      });
      item.addEventListener("dragend", () => {
        item.classList.remove("dragging");
        list.querySelectorAll(".rank-item").forEach((el) => el.classList.remove("drag-over"));
        dragEl = null;
        renumber();
      });
      item.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        const target = e.currentTarget;
        if (!dragEl || target === dragEl) return;
        target.classList.add("drag-over");
        const rect = target.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        if (e.clientY < mid) list.insertBefore(dragEl, target);
        else list.insertBefore(dragEl, target.nextSibling);
        renumber();
      });
      item.addEventListener("dragleave", (e) => {
        e.currentTarget.classList.remove("drag-over");
      });
      item.addEventListener("drop", (e) => {
        e.preventDefault();
        e.currentTarget.classList.remove("drag-over");
        renumber();
      });
    });

    let touchItem = null;
    list.querySelectorAll(".rank-item").forEach((item) => {
      item.addEventListener("touchstart", () => {
        touchItem = item;
        item.classList.add("dragging");
      }, { passive: true });
    });
    list.addEventListener("touchmove", (e) => {
      if (!touchItem) return;
      e.preventDefault();
      const touch = e.touches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const target = el && el.closest(".rank-item");
      if (target && target !== touchItem && list.contains(target)) {
        const rect = target.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        if (touch.clientY < mid) list.insertBefore(touchItem, target);
        else list.insertBefore(touchItem, target.nextSibling);
        renumber();
      }
    }, { passive: false });
    list.addEventListener("touchend", () => {
      if (touchItem) {
        touchItem.classList.remove("dragging");
        touchItem = null;
        renumber();
      }
    }, { passive: true });
  }

  window.initSortable = initSortable;
  window.getRanking = function (list) {
    return Array.from(list.querySelectorAll(".rank-item")).map(
      (li) => decodeURIComponent(li.getAttribute("data-name") || "")
    );
  };
})();
(function () {
  const cfg = window.POLL_CONFIG;
  const root = document.getElementById("app");

  function flash(msg, cat) {
    const el = document.getElementById("flash");
    if (!el) return;
    el.innerHTML = `<div class="flash flash-${cat || "success"}">${msg}</div>`;
    setTimeout(() => { el.innerHTML = ""; }, 4000);
  }

  function route() {
    const hash = location.hash.slice(1) || "/";
    const [path, qs] = hash.split("?");
    const params = new URLSearchParams(qs || "");
    if (path === "/" || path === "") renderIndex();
    else if (path.startsWith("/vote/")) renderVote(path.split("/")[2]);
    else if (path === "/admin") renderAdmin(params.get("key") || "");
    else renderIndex();
  }

  function renderIndex() {
    document.title = cfg.TITLE;
    const teamsHtml = Object.entries(cfg.TEAMS)
      .map(([tid, team], i) => {
        const done = PollStore.hasVoted(tid);
        return `
        <a class="team-card ${done ? "done" : ""}"
           href="${done ? "#" : `#/vote/${tid}`}">
          <div class="team-badge">${i + 1}</div>
          <div class="team-info">
            <h2>${team.name}</h2>
            <p>${team.members.length} участников</p>
          </div>
          <div class="team-action">
            ${done
              ? '<span class="pill success">✓ Голос учтён</span>'
              : '<span class="pill">Ранжировать →</span>'}
          </div>
        </a>`;
      })
      .join("");

    root.innerHTML = `
      <div id="flash" class="flash-wrap"></div>
      <header class="hero">
        <h1>${cfg.TITLE}</h1>
        <p class="subtitle">${cfg.SUBTITLE}</p>
      </header>
      <section class="teams">${teamsHtml}</section>
      <footer class="foot">
        <p>Один голос на команду с этого устройства. Расставьте всех от <strong>самого значимого</strong> (верх) к менее значимому (низ).</p>
        <a class="admin-link" href="#/admin?key=${encodeURIComponent(cfg.ADMIN_SECRET)}">Результаты (админ)</a>
      </footer>`;
  }

  function renderVote(teamId) {
    const team = cfg.TEAMS[teamId];
    if (!team) { location.hash = "#/"; return; }
    if (PollStore.hasVoted(teamId)) {
      flash("Вы уже проголосовали за эту команду.", "warning");
      location.hash = "#/";
      return;
    }
    document.title = team.name + " — " + cfg.TITLE;
    const items = team.members
      .map(
        (m, i) => `
      <li class="rank-item" data-name="${encodeURIComponent(m)}" draggable="true">
        <span class="handle" title="Перетащить">⠿</span>
        <span class="place">${i + 1}</span>
        <span class="name">${m}</span>
      </li>`
      )
      .join("");

    root.innerHTML = `
      <div id="flash" class="flash-wrap"></div>
      <header class="hero compact">
        <a class="back" href="#/">← Назад</a>
        <h1>${team.name}</h1>
        <p class="subtitle">Перетащите карточки: <strong>1 место = самый значимый</strong>. Обязательно расставьте всех.</p>
      </header>
      <div class="hint-bar">
        <span>↑ Более значимый</span>
        <span>${team.members.length} / ${team.members.length}</span>
        <span>Менее значимый ↓</span>
      </div>
      <ul id="sortable" class="rank-list" aria-label="Список для ранжирования">
        ${items}
      </ul>
      <div class="actions sticky-actions">
        <button type="button" class="btn primary" id="submit-btn">Отправить рейтинг</button>
      </div>`;

    const list = document.getElementById("sortable");
    initSortable(list);
    document.getElementById("submit-btn").addEventListener("click", () => {
      const ranking = getRanking(list);
      const expected = new Set(team.members);
      if (ranking.length !== expected.size || ranking.some((n) => !expected.has(n))) {
        flash("Нужно расставить ВСЕХ участников.", "error");
        return;
      }
      PollStore.addVote(teamId, ranking);
      flash(`Спасибо! Ваш рейтинг для «${team.name}» сохранён.`, "success");
      location.hash = "#/";
    });
  }

  function pluralVotes(n) {
    if (n === 0) return "нет голосов";
    if (n === 1) return "1 голос";
    if (n >= 2 && n <= 4) return n + " голоса";
    return n + " голосов";
  }

  function renderAdmin(key) {
    if (key !== cfg.ADMIN_SECRET) {
      root.innerHTML = `
        <div class="hero">
          <h1>403</h1>
          <p class="subtitle">Неверный ключ. Откройте <code>/#/admin?key=…</code></p>
          <a class="back" href="#/">← На главную</a>
        </div>`;
      return;
    }
    document.title = "Результаты — " + cfg.TITLE;
    const total = PollStore.totalBallots();
    const cards = Object.keys(cfg.TEAMS)
      .map((tid) => {
        const res = PollStore.bordaScores(tid);
        const rows =
          res.vote_count === 0
            ? `<p class="empty">Пока нет голосов</p>`
            : `<ol class="results-list">
            ${res.ranked
              .map((item) => {
                const pct = item.max_points ? (item.points / item.max_points) * 100 : 0;
                const top = item.place <= 3 ? "top" : "";
                return `<li class="result-row ${top}">
                  <span class="r-place">${item.place}</span>
                  <span class="r-name">${item.name}</span>
                  <span class="r-pts"><strong>${item.points}</strong> <small>очк.</small></span>
                  <div class="r-bar-wrap"><div class="r-bar" style="width:${pct}%"></div></div>
                </li>`;
              })
              .join("")}
          </ol>`;
        return `
        <section class="result-card">
          <div class="result-head">
            <h2>${res.name}</h2>
            <span class="pill">${pluralVotes(res.vote_count)}</span>
          </div>
          ${rows}
        </section>`;
      })
      .join("");

    root.innerHTML = `
      <div id="flash" class="flash-wrap"></div>
      <header class="hero">
        <a class="back" href="#/">← На главную</a>
        <h1>📊 Результаты</h1>
        <p class="subtitle">Всего бюллетеней: <strong>${total}</strong> · Borda: 1 место = N очков, последнее = 1</p>
      </header>
      <div class="note-banner">
        Голоса хранятся в браузере (localStorage). Чтобы объединить голоса с других устройств — экспортируйте JSON у каждого и импортируйте здесь.
      </div>
      <div class="admin-grid">${cards}</div>
      <div class="import-box">
        <strong>Экспорт / импорт голосов</strong>
        <textarea id="io-json" placeholder="JSON голосов…"></textarea>
        <div class="row">
          <button type="button" class="btn secondary" id="btn-export">Экспорт</button>
          <button type="button" class="btn secondary" id="btn-import">Импорт (merge)</button>
          <button type="button" class="btn danger" id="btn-reset">Сбросить все голоса</button>
        </div>
      </div>
      <footer class="foot">
        <p>Админ-ссылка: <code>/#/admin?key=${cfg.ADMIN_SECRET}</code></p>
      </footer>`;

    document.getElementById("btn-export").onclick = () => {
      document.getElementById("io-json").value = PollStore.exportJSON();
      flash("Экспортировано в поле ниже.", "success");
    };
    document.getElementById("btn-import").onclick = () => {
      try {
        const n = PollStore.importJSON(document.getElementById("io-json").value);
        flash(`Добавлено новых голосов: ${n}`, "success");
        renderAdmin(key);
      } catch (e) {
        flash("Ошибка импорта: " + e.message, "error");
      }
    };
    document.getElementById("btn-reset").onclick = () => {
      if (confirm("Сбросить ВСЕ голоса на этом устройстве?")) {
        PollStore.resetAll();
        flash("Все голоса сброшены.", "success");
        renderAdmin(key);
      }
    };
  }

  window.addEventListener("hashchange", route);
  route();
})();

  </script>
</body>
</html>
